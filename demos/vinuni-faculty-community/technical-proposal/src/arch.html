<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#fff;font-family:Helvetica,Arial,sans-serif}
svg text{font-family:Helvetica,Arial,sans-serif}
</style></head><body>
<svg id="d" xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#464E5E"/></marker></defs>
  <rect x="0" y="0" width="1200" height="640" fill="#fff"/>
  <!-- VinUni boundary -->
  <rect x="300" y="30" width="880" height="590" rx="18" fill="#F3F6FB" stroke="#1D3C73" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="324" y="62" font-size="17" font-weight="700" fill="#1D3C73">VinUniversity-controlled infrastructure</text>
  <!-- users -->
  <rect x="20" y="230" width="230" height="150" rx="14" fill="#fff" stroke="#C72027" stroke-width="2"/>
  <text x="135" y="270" text-anchor="middle" font-size="18" font-weight="700" fill="#0A1834">Faculty and staff</text>
  <text x="135" y="298" text-anchor="middle" font-size="14" fill="#464E5E">Browser on laptop</text>
  <text x="135" y="318" text-anchor="middle" font-size="14" fill="#464E5E">or phone</text>
  <text x="135" y="352" text-anchor="middle" font-size="13" fill="#737B8C">no separate password</text>
  <!-- Entra -->
  <rect x="340" y="90" width="300" height="120" rx="14" fill="#fff" stroke="#1D3C73" stroke-width="2"/>
  <text x="490" y="128" text-anchor="middle" font-size="18" font-weight="700" fill="#0A1834">Microsoft Entra ID</text>
  <text x="490" y="154" text-anchor="middle" font-size="14" fill="#464E5E">VinUni single sign-on</text>
  <text x="490" y="176" text-anchor="middle" font-size="14" fill="#464E5E">multi-factor, Conditional Access</text>
  <!-- web app -->
  <rect x="340" y="260" width="300" height="140" rx="14" fill="#1D3C73"/>
  <text x="490" y="300" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Faculty Hub web app</text>
  <text x="490" y="326" text-anchor="middle" font-size="14" fill="#DCE4F4">community.vinuni.edu.vn (proposed)</text>
  <text x="490" y="350" text-anchor="middle" font-size="14" fill="#DCE4F4">HTTPS only · role-based access</text>
  <text x="490" y="374" text-anchor="middle" font-size="14" fill="#DCE4F4">buddy programme + information hub</text>
  <!-- app db -->
  <rect x="340" y="460" width="300" height="120" rx="14" fill="#fff" stroke="#1D3C73" stroke-width="2"/>
  <text x="490" y="498" text-anchor="middle" font-size="18" font-weight="700" fill="#0A1834">Hub database</text>
  <text x="490" y="524" text-anchor="middle" font-size="14" fill="#464E5E">profiles, buddy matches, guides,</text>
  <text x="490" y="546" text-anchor="middle" font-size="14" fill="#464E5E">providers, audit log · encrypted</text>
  <!-- HR -->
  <rect x="790" y="260" width="360" height="140" rx="14" fill="#fff" stroke="#1D3C73" stroke-width="2"/>
  <text x="970" y="300" text-anchor="middle" font-size="18" font-weight="700" fill="#0A1834">VinUni staff records</text>
  <text x="970" y="326" text-anchor="middle" font-size="14" fill="#464E5E">HR system or Entra directory</text>
  <text x="970" y="350" text-anchor="middle" font-size="14" fill="#464E5E">name, email, unit, title, status</text>
  <text x="970" y="374" text-anchor="middle" font-size="14" fill="#C72027" font-weight="700">read-only, agreed fields only</text>
  <!-- monitoring -->
  <rect x="790" y="460" width="360" height="120" rx="14" fill="#fff" stroke="#1D3C73" stroke-width="2"/>
  <text x="970" y="498" text-anchor="middle" font-size="18" font-weight="700" fill="#0A1834">IT monitoring and backups</text>
  <text x="970" y="524" text-anchor="middle" font-size="14" fill="#464E5E">access and audit logs,</text>
  <text x="970" y="546" text-anchor="middle" font-size="14" fill="#464E5E">encrypted backups</text>
  <!-- arrows -->
  <line x1="250" y1="305" x2="336" y2="320" stroke="#464E5E" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="258" y="292" font-size="13" fill="#464E5E">HTTPS</text>
  <line x1="490" y1="258" x2="490" y2="214" stroke="#464E5E" stroke-width="2.5" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="502" y="242" font-size="13" fill="#464E5E">sign-in (OpenID Connect)</text>
  <line x1="490" y1="402" x2="490" y2="456" stroke="#464E5E" stroke-width="2.5" marker-end="url(#a)" marker-start="url(#a)"/>
  <line x1="786" y1="330" x2="644" y2="330" stroke="#464E5E" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="660" y="318" font-size="13" fill="#464E5E">daily sync, read-only</text>
  <line x1="644" y1="520" x2="786" y2="520" stroke="#464E5E" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="664" y="508" font-size="13" fill="#464E5E">logs, backups</text>
</svg></body></html>
