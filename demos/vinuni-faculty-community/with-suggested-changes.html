<style>
:root {
  --navy-950: #0A1834;
  --navy-900: #122A57;
  --navy-800: #1D3C73;
  --navy-700: #1B427B;
  --navy-500: #4A6BB0;
  --navy-100: #DCE4F4;
  --navy-50: #EEF2FA;
  --red: #C72027;
  --red-700: #9C171D;
  --red-50: #FCECEF;
  --gold: #B88A2E;
  --gold-50: #FBF4E4;
  --green: #1E7A4C;
  --green-50: #E7F4EC;
  --amber: #A86200;
  --amber-50: #FDF2E1;
  --ink: #171B24;
  --ink-2: #444C5C;
  --ink-3: #737B8C;
  --line: #E2E5EB;
  --line-2: #EEF0F4;
  --bg: #F5F6F8;
  --surface: #FFFFFF;
  --ann: #5B3FD1;
  --ann-50: #F1EDFF;
  --chg: #0E7A6E;
  --chg-50: #E2F5F2;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 1px 3px rgba(16, 24, 40, .06);
  --shadow-lg: 0 12px 32px rgba(11, 35, 80, .16);
  --font: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif: "Newsreader", Georgia, "Times New Roman", serif;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font-family: var(--font); font-size: 15px; line-height: 1.5; color: var(--ink); background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--navy-700); text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2, h3, h4 { margin: 0; line-height: 1.2; }
p { margin: 0 0 .75em; }
ul { margin: 0 0 .75em; padding-left: 1.2em; }
svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
svg.i.sm { width: 15px; height: 15px; }
svg.i.lg { width: 22px; height: 22px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- Demo bar ---------- */
.demo-bar { position: sticky; top: 0; z-index: 60; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 7px 16px; background: var(--navy-950); color: #C9D3E8; font-size: 12.5px; }
.demo-bar b { color: #fff; font-weight: 600; }
.demo-bar .pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 99px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); }
.demo-bar .pill.mode-proposal { background: rgba(124, 99, 240, .25); border-color: rgba(160, 140, 255, .5); color: #E6E0FF; }
.demo-bar .pill.mode-revised { background: rgba(20, 160, 140, .25); border-color: rgba(80, 210, 190, .5); color: #D5FBF5; }
.demo-bar .spacer { flex: 1; }
.demo-bar button, .demo-bar a.btnlink, .demo-bar select { background: transparent; border: 1px solid rgba(255,255,255,.22); color: #E7ECF7; border-radius: 6px; padding: 3px 9px; font-size: 12.5px; cursor: pointer; }
.demo-bar select option { color: var(--ink); }
.demo-bar button:hover, .demo-bar a.btnlink:hover { background: rgba(255,255,255,.1); text-decoration: none; }
.demo-bar label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }

/* ---------- Shell ---------- */
.shell { display: grid; grid-template-columns: 264px minmax(0, 1fr); min-height: calc(100vh - var(--bar, 38px)); }
.side { position: sticky; top: var(--bar, 38px); height: calc(100vh - var(--bar, 38px)); overflow-y: auto; background: var(--navy-900); color: #C3CDE2; display: flex; flex-direction: column; }
.brand { display: flex; align-items: center; gap: 11px; padding: 20px 20px 18px; border-bottom: 1px solid rgba(255,255,255,.08); }

.hero.ph { background: linear-gradient(100deg, rgba(10,24,52,.97) 0%, rgba(18,42,87,.92) 42%, rgba(18,42,87,.4) 72%, rgba(18,42,87,.12) 100%), var(--ph) center 38% / cover; }
.banner { position: relative; height: 150px; border-radius: 14px; overflow: hidden; background: linear-gradient(0deg, rgba(10,24,52,.72), rgba(10,24,52,0) 60%), var(--ph) center 45% / cover; display: flex; align-items: flex-end; padding: 14px 18px; color: #fff; font-size: 13px; font-weight: 600; }
.brand-txt { line-height: 1.15; }
.brand-txt b { display: block; color: #fff; font-size: 15px; letter-spacing: .2px; }
.brand-txt span { font-size: 11.5px; color: #93A3C6; letter-spacing: .3px; }
.nav { padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; }
.nav-h { padding: 14px 12px 6px; font-size: 10.5px; letter-spacing: 1.1px; text-transform: uppercase; color: #7D8FB6; font-weight: 600; }
.nav a { display: flex; align-items: center; gap: 11px; padding: 8px 12px; border-radius: 8px; color: #C3CDE2; font-size: 14px; font-weight: 500; }
.nav a:hover { background: rgba(255,255,255,.06); color: #fff; text-decoration: none; }
.nav a.on { background: rgba(255,255,255,.11); color: #fff; box-shadow: inset 3px 0 0 var(--red); }
.nav a .count { margin-left: auto; min-width: 20px; padding: 0 6px; border-radius: 99px; background: var(--red); color: #fff; font-size: 11px; font-weight: 700; text-align: center; line-height: 18px; }
.nav a.locked { opacity: .45; }
.side-foot { margin-top: auto; padding: 14px 20px; font-size: 11.5px; color: #7D8FB6; border-top: 1px solid rgba(255,255,255,.08); }

.main { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: var(--bar, 38px); z-index: 40; display: flex; align-items: center; gap: 12px; padding: 12px 28px; background: rgba(245,246,248,.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.icon-btn.menu-btn { display: none; }
.search { position: relative; flex: 1; max-width: 520px; }
.search input { width: 100%; padding: 9px 12px 9px 38px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; outline: none; }
.search input:focus { border-color: var(--navy-500); box-shadow: 0 0 0 3px var(--navy-50); }
.search > svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--ink-3); }
.search-res { position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-lg); max-height: 420px; overflow: auto; padding: 6px; display: none; }
.search-res.open { display: block; }
.search-res .grp { padding: 8px 10px 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--ink-3); font-weight: 600; }
.search-res a { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 8px; color: var(--ink); }
.search-res a:hover { background: var(--navy-50); text-decoration: none; }
.search-res .sub { color: var(--ink-3); font-size: 12.5px; }
.top-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.icon-btn { position: relative; width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; color: var(--ink-2); }
.icon-btn:hover { border-color: var(--navy-500); color: var(--navy-700); }
.icon-btn .dot { position: absolute; top: 6px; right: 7px; width: 8px; height: 8px; border-radius: 50%; background: var(--red); border: 2px solid var(--surface); }
.me-chip { display: flex; align-items: center; gap: 9px; padding: 4px 10px 4px 4px; border: 1px solid var(--line); background: var(--surface); border-radius: 99px; cursor: pointer; }
.me-chip .nm { font-size: 13px; font-weight: 600; line-height: 1.1; }
.me-chip .rl { font-size: 11px; color: var(--ink-3); }

.content { padding: 28px; max-width: 1240px; width: 100%; }
.page-h { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
.page-h h1 { font-family: var(--serif); font-weight: 600; font-size: 32px; letter-spacing: -.4px; color: var(--navy-900); }
.page-h .lede { color: var(--ink-2); margin-top: 6px; max-width: 680px; }
.crumbs { font-size: 13px; color: var(--ink-3); margin-bottom: 8px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.crumbs a { color: var(--ink-3); }

/* ---------- Building blocks ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.card-pad { padding: 20px; }
.card-h { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--line-2); }
.card-h h2, .card-h h3 { font-size: 15.5px; font-weight: 700; color: var(--navy-900); display: flex; align-items: center; gap: 8px; }
.card-b { padding: 16px 20px; }
.grid { display: grid; gap: 18px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g-auto { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.split { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; align-items: start; }
.stack { display: flex; flex-direction: column; gap: 18px; }
.row { display: flex; align-items: center; gap: 10px; }
.row.wrap { flex-wrap: wrap; }
.between { justify-content: space-between; }
.muted { color: var(--ink-3); }
.small { font-size: 13px; }
.tiny { font-size: 12px; }
.strong { font-weight: 700; }
.mt8 { margin-top: 8px; } .mt12 { margin-top: 12px; } .mt16 { margin-top: 16px; } .mt24 { margin-top: 24px; }
.mb8 { margin-bottom: 8px; } .mb12 { margin-bottom: 12px; } .mb16 { margin-bottom: 16px; }
.hr { height: 1px; background: var(--line-2); margin: 14px 0; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 8px 14px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 14px; cursor: pointer; color: var(--ink); white-space: nowrap; }
.btn:hover { border-color: var(--navy-500); text-decoration: none; }
.btn.primary { background: var(--navy-800); border-color: var(--navy-800); color: #fff; }
.btn.primary:hover { background: var(--navy-700); }
.btn.red { background: var(--red); border-color: var(--red); color: #fff; }
.btn.red:hover { background: var(--red-700); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--navy-700); }
.btn.ghost:hover { background: var(--navy-50); }
.btn.sm { padding: 5px 10px; font-size: 13px; border-radius: 7px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

.badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 99px; font-size: 12px; font-weight: 600; background: var(--line-2); color: var(--ink-2); white-space: nowrap; }
.badge.navy { background: var(--navy-50); color: var(--navy-700); }
.badge.red { background: var(--red-50); color: var(--red-700); }
.badge.green { background: var(--green-50); color: var(--green); }
.badge.amber { background: var(--amber-50); color: var(--amber); }
.badge.gold { background: var(--gold-50); color: #7D5B12; }
.badge.solid { background: var(--navy-800); color: #fff; }
.badge.official { background: var(--navy-800); color: #fff; }
.badge.peer { background: var(--gold-50); color: #7D5B12; border: 1px solid #EBD9AE; }
.tag { display: inline-flex; padding: 2px 9px; border-radius: 6px; background: var(--bg); border: 1px solid var(--line); font-size: 12.5px; color: var(--ink-2); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }

.av { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 13.5px; flex: none; letter-spacing: .3px; }
.av.sm { width: 28px; height: 28px; font-size: 11px; }
.av.lg { width: 64px; height: 64px; font-size: 22px; }
.av.xl { width: 84px; height: 84px; font-size: 28px; }
.av.guest { background: #fff !important; color: var(--ink-2); border: 2px dashed #A9B1C2; }
.av-stack { display: flex; }
.av-stack .av { border: 2px solid var(--surface); margin-left: -8px; }
.av-stack .av:first-child { margin-left: 0; }

.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.field > label, .field > .lbl { font-weight: 600; font-size: 13.5px; display: flex; align-items: center; gap: 8px; }
.input, select.input, textarea.input { width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); outline: none; }
.input:focus { border-color: var(--navy-500); box-shadow: 0 0 0 3px var(--navy-50); }
textarea.input { min-height: 96px; resize: vertical; }
.hint { font-size: 12.5px; color: var(--ink-3); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border: 1px solid var(--line); border-radius: 99px; background: var(--surface); font-size: 13px; cursor: pointer; user-select: none; }
.chip:hover { border-color: var(--navy-500); }
.chip.on { background: var(--navy-800); border-color: var(--navy-800); color: #fff; }
.chip input { display: none; }
.seg { display: inline-flex; padding: 3px; border-radius: 10px; background: var(--line-2); gap: 2px; }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--ink-2); }
.seg button.on { background: var(--surface); color: var(--navy-800); box-shadow: var(--shadow); }
.toggle { position: relative; width: 38px; height: 22px; flex: none; }
.toggle input { opacity: 0; width: 0; height: 0; }
.toggle span { position: absolute; inset: 0; background: #C5CBD6; border-radius: 99px; transition: .15s; cursor: pointer; }
.toggle span::after { content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .15s; }
.toggle input:checked + span { background: var(--green); }
.toggle input:checked + span::after { transform: translateX(16px); }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 20px; overflow-x: auto; }
.tabs a { padding: 10px 14px; font-weight: 600; font-size: 14px; color: var(--ink-3); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; display: flex; gap: 7px; align-items: center; }
.tabs a:hover { color: var(--ink); text-decoration: none; }
.tabs a.on { color: var(--navy-800); border-color: var(--red); }

.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--ink-3); font-weight: 600; padding: 10px 12px; border-bottom: 1px solid var(--line); background: #FAFBFC; }
.tbl td { padding: 11px 12px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl-wrap { overflow-x: auto; }

.notice { display: flex; gap: 12px; padding: 12px 16px; border-radius: 10px; background: var(--navy-50); color: var(--navy-900); font-size: 14px; align-items: flex-start; }
.notice svg { margin-top: 2px; }
.notice.warn { background: var(--amber-50); color: #6B3F00; }
.notice.red { background: var(--red-50); color: var(--red-700); }
.notice.green { background: var(--green-50); color: #11502F; }
.notice.gold { background: var(--gold-50); color: #5E4511; border: 1px solid #EBD9AE; }

.progress { height: 8px; border-radius: 99px; background: var(--line-2); overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--navy-700); border-radius: 99px; }
.progress.green > i { background: var(--green); }
.progress.red > i { background: var(--red); }

.empty { padding: 32px; text-align: center; color: var(--ink-3); }

/* ---------- Annotations (proposal refs + revised changes) ---------- */
.ann { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 6px; font-size: 11.5px; font-weight: 600; letter-spacing: .1px; background: var(--ann-50); color: var(--ann); border: 1px dashed #B9A9F5; white-space: nowrap; vertical-align: middle; cursor: help; }
.ann.tech { background: #F3F4F6; color: #475066; border-color: #C9CED8; }
.ann.chg { background: var(--chg-50); color: var(--chg); border-color: #8ED3C8; }
body.no-ann .ann { display: none !important; }
.chg-box { border: 1.5px dashed #8ED3C8; background: linear-gradient(0deg, rgba(226,245,242,.35), rgba(226,245,242,.35)), var(--surface); }
body.no-ann .chg-box { border: 1px solid var(--line); background: var(--surface); }

/* ---------- Home ---------- */
.hero { position: relative; overflow: hidden; border-radius: 16px; padding: 28px 30px; color: #fff; background: radial-gradient(1200px 400px at 90% -40%, rgba(200,16,46,.45), transparent 60%), linear-gradient(120deg, var(--navy-900), var(--navy-700)); }
.hero h1 { font-family: var(--serif); font-weight: 600; font-size: 34px; letter-spacing: -.4px; }
.hero p { color: #D1DAEE; max-width: 640px; margin-top: 8px; }
.hero .hero-stats { display: flex; gap: 28px; margin-top: 20px; flex-wrap: wrap; }
.hero .hero-stats div b { display: block; font-size: 24px; font-family: var(--serif); }
.hero .hero-stats div span { font-size: 12.5px; color: #B9C6E2; }
.hero .btn { border-color: rgba(255,255,255,.3); background: rgba(255,255,255,.1); color: #fff; }
.hero .btn.red { background: var(--red); border-color: var(--red); }
.countdown { display: flex; gap: 10px; align-items: baseline; }
.countdown b { font-family: var(--serif); font-size: 56px; line-height: 1; }
.q-col h2 { font-family: var(--serif); font-size: 20px; color: var(--navy-900); font-weight: 600; margin-bottom: 2px; }
.q-col .q-sub { font-size: 13px; color: var(--ink-3); margin-bottom: 12px; }
.list-item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line-2); }
.list-item:last-child { border-bottom: 0; }
.list-item .li-main { min-width: 0; flex: 1; }
.list-item .li-title { font-weight: 600; font-size: 14px; color: var(--ink); display: block; overflow: hidden; text-overflow: ellipsis; }
.list-item .li-sub { font-size: 12.5px; color: var(--ink-3); }
a.list-item:hover { text-decoration: none; }
a.list-item:hover .li-title { color: var(--navy-700); }
.date-tile { width: 46px; flex: none; text-align: center; border-radius: 9px; border: 1px solid var(--line); overflow: hidden; background: var(--surface); }
.date-tile .m { background: var(--red); color: #fff; font-size: 10.5px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; padding: 2px 0; }
.date-tile .d { font-family: var(--serif); font-size: 19px; font-weight: 700; padding: 2px 0 3px; color: var(--navy-900); }
.steps { display: flex; flex-direction: column; gap: 8px; }
.step { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.step .tick { width: 24px; height: 24px; border-radius: 50%; border: 2px solid #C5CBD6; display: grid; place-items: center; flex: none; cursor: pointer; background: var(--surface); }
.step.done .tick { background: var(--green); border-color: var(--green); color: #fff; }
.step.done .st-title { color: var(--ink-3); text-decoration: line-through; }
.step .st-title { font-weight: 600; font-size: 14px; }
.step .when { font-size: 12px; color: var(--ink-3); min-width: 98px; }

/* ---------- Directory & people ---------- */
.filters { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.person { display: flex; flex-direction: column; gap: 10px; padding: 16px; cursor: pointer; transition: border-color .12s, transform .12s; }
.person:hover { border-color: var(--navy-500); transform: translateY(-1px); }
.person .p-name { font-weight: 700; font-size: 15px; }
.person .p-title { font-size: 12.5px; color: var(--ink-3); }
.kv { display: grid; grid-template-columns: 150px 1fr; gap: 8px 14px; font-size: 14px; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; }

/* ---------- Drawer / modal / toast ---------- */
.scrim { position: fixed; inset: 0; background: rgba(7, 23, 53, .45); z-index: 80; opacity: 0; pointer-events: none; transition: opacity .15s; }
.scrim.open { opacity: 1; pointer-events: auto; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 100vw); background: var(--surface); z-index: 90; transform: translateX(100%); transition: transform .2s ease; display: flex; flex-direction: column; box-shadow: var(--shadow-lg); }
.drawer.open { transform: none; }
.drawer-h { padding: 18px 22px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.drawer-b { padding: 22px; overflow-y: auto; flex: 1; }
.modal { position: fixed; left: 50%; top: 50%; z-index: 95; width: min(620px, calc(100vw - 32px)); max-height: calc(100vh - 64px); overflow: auto; transform: translate(-50%, -48%); opacity: 0; pointer-events: none; transition: .15s; background: var(--surface); border-radius: 16px; box-shadow: var(--shadow-lg); }
.modal.open { transform: translate(-50%, -50%); opacity: 1; pointer-events: auto; }
.modal-h { padding: 18px 22px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.modal-h h2 { font-family: var(--serif); font-size: 22px; color: var(--navy-900); font-weight: 600; }
.modal-b { padding: 20px 22px; }
.modal-f { padding: 14px 22px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; }
.toasts { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 100; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast { background: var(--navy-950); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; box-shadow: var(--shadow-lg); display: flex; gap: 10px; align-items: center; animation: tin .2s ease; max-width: calc(100vw - 32px); }
.toast .auto { font-size: 11px; padding: 1px 7px; border-radius: 99px; background: rgba(255,255,255,.14); }
@keyframes tin { from { opacity: 0; transform: translateY(8px); } }
.notif-panel { position: absolute; right: 0; top: calc(100% + 8px); width: min(380px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow-lg); display: none; z-index: 50; }
.notif-panel.open { display: block; }
.notif { display: flex; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line-2); font-size: 13.5px; color: var(--ink); }
.notif:hover { background: var(--navy-50); text-decoration: none; }
.notif.unread { background: #F8FAFF; }
.notif .nd { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
.fab { position: fixed; right: 22px; bottom: 22px; z-index: 45; box-shadow: var(--shadow-lg); border-radius: 99px; padding: 11px 18px; }

/* ---------- Forums / threads ---------- */
.forum-card { padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.forum-card:hover { border-color: var(--navy-500); text-decoration: none; }
.forum-card h3 { font-size: 16px; color: var(--navy-900); line-height: 1.3; }
.forum-card .fc-stats { display: flex; gap: 14px; font-size: 12.5px; color: var(--ink-3); margin-top: auto; }
.forum-ico { width: 40px; height: 40px; border-radius: 10px; background: var(--navy-50); color: var(--navy-700); display: grid; place-items: center; }
.thread-row { display: flex; gap: 14px; padding: 14px 20px; border-bottom: 1px solid var(--line-2); align-items: flex-start; color: var(--ink); }
.thread-row:hover { background: #FAFBFD; text-decoration: none; }
.thread-row:last-child { border-bottom: 0; }
.thread-row .tr-title { font-weight: 700; font-size: 15px; color: var(--ink); }
.thread-row .tr-meta { font-size: 12.5px; color: var(--ink-3); margin-top: 3px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.thread-row .tr-replies { margin-left: auto; text-align: center; min-width: 54px; }
.thread-row .tr-replies b { display: block; font-size: 17px; }
.thread-row .tr-replies span { font-size: 11px; color: var(--ink-3); }
.post { display: flex; gap: 14px; padding: 18px 20px; border-bottom: 1px solid var(--line-2); }
.post:last-child { border-bottom: 0; }
.post .post-body { flex: 1; min-width: 0; }
.post .post-meta { display: flex; gap: 8px; align-items: center; font-size: 13px; flex-wrap: wrap; margin-bottom: 6px; }
.post .post-meta b { font-size: 14px; }
.post .post-actions { display: flex; gap: 6px; margin-top: 8px; }
.post.op { background: #FBFCFE; }

/* ---------- Matching ---------- */
.flow { display: flex; gap: 0; align-items: stretch; overflow-x: auto; padding-bottom: 4px; }
.flow-step { flex: 1; min-width: 128px; position: relative; padding: 12px 14px 12px 20px; background: var(--line-2); color: var(--ink-3); font-size: 12.5px; font-weight: 600; clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 50%, calc(100% - 12px) 100%, 0 100%, 12px 50%); }
.flow-step:first-child { clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 50%, calc(100% - 12px) 100%, 0 100%); padding-left: 14px; }
.flow-step.done { background: var(--navy-100); color: var(--navy-800); }
.flow-step.cur { background: var(--navy-800); color: #fff; }
.flow-step small { display: block; font-weight: 500; opacity: .8; font-size: 11.5px; }
.match-card { padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.score-ring { --p: 50; width: 58px; height: 58px; border-radius: 50%; background: conic-gradient(var(--navy-700) calc(var(--p) * 1%), var(--line-2) 0); display: grid; place-items: center; flex: none; }
.score-ring b { width: 46px; height: 46px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-size: 14px; color: var(--navy-900); }
.fbar { display: grid; grid-template-columns: 130px 1fr 34px; gap: 8px; align-items: center; font-size: 12px; color: var(--ink-2); }
.fbar .progress { height: 6px; }
.imp { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line-2); }
.imp:last-child { border-bottom: 0; }

/* ---------- Events ---------- */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
.cal .dow { padding: 8px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .6px; color: var(--ink-3); font-weight: 600; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); background: #FAFBFC; }
.cal .day { min-height: 104px; padding: 6px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); font-size: 12px; background: var(--surface); }
.cal .day.out { background: #FAFBFC; color: #B5BBC7; }
.cal .day.today .dn { background: var(--red); color: #fff; }
.cal .dn { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; font-weight: 600; margin-bottom: 3px; }
.cal .ev { display: block; padding: 2px 6px; margin-bottom: 3px; border-radius: 5px; background: var(--navy-50); color: var(--navy-800); font-weight: 600; font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; border-left: 3px solid var(--navy-700); }
.cal .ev.official { background: var(--red-50); color: var(--red-700); border-color: var(--red); }
.cal .ev.Sports { background: var(--green-50); color: var(--green); border-color: var(--green); }
.cal .ev.Family { background: var(--gold-50); color: #7D5B12; border-color: var(--gold); }
.cap { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-3); }
.cap .progress { flex: 1; height: 6px; }

/* ---------- Recommendations ---------- */
.rec { padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.rec h3 { font-size: 15.5px; line-height: 1.3; }
.fresh { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; }
.fresh i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.fresh.current { color: var(--green); } .fresh.current i { background: var(--green); }
.fresh.due { color: var(--amber); } .fresh.due i { background: var(--amber); }
.fresh.old { color: var(--red-700); } .fresh.old i { background: var(--red); }

/* ---------- Guides ---------- */
.guide-card { padding: 18px; display: flex; flex-direction: column; gap: 10px; color: var(--ink); }
.guide-card:hover { border-color: var(--navy-500); text-decoration: none; }
.guide-card h3 { font-family: var(--serif); font-size: 19px; color: var(--navy-900); font-weight: 600; }
.article { max-width: 760px; }
.article h2 { font-family: var(--serif); font-size: 22px; color: var(--navy-900); margin: 26px 0 10px; font-weight: 600; }
.article p, .article li { font-size: 15.5px; line-height: 1.65; color: #2A303C; }
.article .tbl { margin: 8px 0 16px; }
.toc a { display: block; padding: 6px 0; font-size: 14px; color: var(--ink-2); }

/* ---------- Admin ---------- */
.kpi { padding: 16px 18px; }
.kpi .k-l { font-size: 12.5px; color: var(--ink-3); font-weight: 600; display: flex; gap: 6px; align-items: center; }
.kpi .k-v { font-family: var(--serif); font-size: 32px; font-weight: 600; color: var(--navy-900); line-height: 1.1; margin-top: 6px; }
.kpi .k-s { font-size: 12.5px; color: var(--ink-3); margin-top: 2px; }
.kpi.alert .k-v { color: var(--red-700); }
.metric { padding: 18px; }
.metric .m-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.metric .m-v { font-family: var(--serif); font-size: 36px; font-weight: 600; color: var(--navy-900); line-height: 1; }
.metric .m-t { font-size: 12.5px; color: var(--ink-3); }
.metric .m-l { font-weight: 700; font-size: 14px; margin: 10px 0 4px; }
.chart svg { width: 100%; height: auto; display: block; }
.chart text { font-family: var(--font); font-size: 11px; fill: var(--ink-3); }
.hbar { display: grid; grid-template-columns: 150px 1fr 30px; gap: 10px; align-items: center; font-size: 13px; padding: 5px 0; }
.hbar .progress { height: 10px; border-radius: 4px; }
.hbar .progress > i { border-radius: 4px; }
.weight { display: grid; grid-template-columns: 1fr 160px 26px; gap: 12px; align-items: center; padding: 8px 0; font-size: 14px; }
.weight input[type=range] { width: 100%; accent-color: var(--navy-700); }
.flow-row { display: grid; grid-template-columns: 30px 1fr auto; gap: 14px; align-items: center; padding: 14px 20px; border-bottom: 1px solid var(--line-2); }
.flow-row:last-child { border-bottom: 0; }
.flow-ico { width: 30px; height: 30px; border-radius: 8px; background: #EEF3FF; color: #2459C9; display: grid; place-items: center; }

.signin-art h1 { font-family: var(--serif); font-size: 46px; font-weight: 600; letter-spacing: -.8px; line-height: 1.05; margin-top: auto; max-width: 560px; }
.signin-art p { color: #C9D3E8; font-size: 17px; max-width: 520px; margin-top: 16px; }
.signin-art .quote { margin-top: 36px; padding-left: 16px; border-left: 3px solid var(--red); color: #DCE3F3; font-family: var(--serif); font-size: 18px; font-style: italic; max-width: 520px; }
.signin-art .three { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 36px; max-width: 600px; }
.signin-art .three div { padding: 14px; border-radius: 12px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12); font-size: 13.5px; color: #DCE3F3; }
.signin-art .three b { display: block; color: #fff; font-size: 14px; margin-bottom: 4px; }
.lattice { display: none; }
.signin-pane { padding: 48px; display: flex; flex-direction: column; justify-content: center; gap: 18px; max-width: 640px; }
.persona { display: flex; gap: 14px; padding: 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); cursor: pointer; text-align: left; width: 100%; align-items: flex-start; transition: .12s; }
.persona:hover { border-color: var(--navy-700); box-shadow: 0 0 0 3px var(--navy-50); }
.persona .pr { font-size: 11.5px; text-transform: uppercase; letter-spacing: .8px; color: var(--red); font-weight: 700; }
.persona .pn { font-weight: 700; font-size: 16px; }
.persona .pb { font-size: 13.5px; color: var(--ink-2); margin-top: 2px; }
.entra { max-width: 440px; margin: 60px auto; background: var(--surface); padding: 36px 40px; border-radius: 6px; box-shadow: 0 2px 6px rgba(0,0,0,.2); font-family: "Segoe UI", system-ui, sans-serif; }
.entra h2 { font-size: 24px; font-weight: 600; margin: 14px 0 8px; font-family: "Segoe UI", system-ui, sans-serif; }
.entra .err { color: #A4262C; font-size: 14px; margin: 10px 0; }
.entra .acct { padding: 8px 0; font-size: 15px; display: flex; gap: 8px; align-items: center; }

/* ---------- Responsive ---------- */
@media (max-width: 1500px) {
  .demo-bar .note { display: none; }
}
@media (max-width: 1100px) {
  .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .split { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 900px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; top: 0; left: 0; bottom: 0; height: 100vh; width: 280px; z-index: 85; transform: translateX(-100%); transition: transform .2s; }
  body.side-open .side { transform: none; }
  .icon-btn.menu-btn { display: grid; }
  .demo-bar { position: static; }
  .top { top: 0; }
  .demo-bar .note { display: none; }
  .g3, .g2 { grid-template-columns: minmax(0, 1fr); }
  .signin { grid-template-columns: minmax(0, 1fr); }

const THREADS = [
  { id: 't1', forum: 'schools', title: 'Bilingual or full IB for a 9-year-old arriving mid-year?', author: 'david', date: '2026-10-09', body: 'Our daughter is 9 and has only been taught in English and French. We are choosing between a bilingual Vietnamese–English school near Ocean Park and an IB school in Tây Hồ (longer commute). Has anyone moved a child mid-year? How hard was it to settle in?', replies: [
    { author: 'hannah', date: '2026-10-09', body: 'Our son started at a bilingual school in Ocean Park in January. The first month was hard. The school gave him a buddy and extra English–Vietnamese support, and by March he was fine. The short commute made a huge difference to our family life.' },
    { author: 'emily', date: '2026-10-10', body: 'Ask both schools about their mid-year intake support. One IB school I know runs a two-week transition programme. Also check whether the IB school runs a bus to Ocean Park. Most charge for it separately.' }] },
  { id: 't2', forum: 'schools', title: 'Which schools actually run buses to Ocean Park?', author: 'fatima', date: '2026-09-28', body: 'Trying to confirm which schools have a bus stop inside Ocean Park and not just “nearby”. Any up-to-date experience?', replies: [
    { author: 'james', date: '2026-09-29', body: 'Red River International picks up at two points inside the development. The West Lake British School bus stops at the main gate, about 50 minutes each way at rush hour.' }] },
  { id: 't3', forum: 'schools', title: 'Mid-year admissions: documents to prepare before you arrive', author: 'emily', date: '2026-08-20', pinned: true, body: 'Collected from several families: passports, previous two years of school reports (translated if not in English), vaccination records, birth certificates, and a letter from the previous school. Some schools also ask for an entrance assessment, which can usually be done online before arrival.', replies: [
    { author: 'aisha', date: '2026-08-21', body: 'Add: medical history for children with allergies. Our school nurse asked for it on day one.' },
    { author: 'anna', date: '2026-08-25', body: 'For kindergarten, some schools ask for a short video call with the child. Worth asking early.' }] },
  { id: 't4', forum: 'housing', title: 'Ocean Park vs. Tây Hồ for a family that commutes every day', author: 'david', date: '2026-10-12', body: 'Tây Hồ has more international restaurants and schools, but the commute looks long. How do you all weigh this up?', replies: [
    { author: 'lucas', date: '2026-10-12', body: 'I live in Tây Hồ and love it, but it is 45–60 minutes each way in traffic. For a family with a school run as well, I would not do it.' },
    { author: 'james', date: '2026-10-13', body: 'Ocean Park: 10 minutes to campus, lots of families, parks. You trade some atmosphere for about 1.5 hours a day back. Happy to show you around on a weekend.' }] },
  { id: 't5', forum: 'housing', title: 'Realtor experiences: please share the good and the bad', author: 'james', date: '2026-07-03', pinned: true, body: 'Moderator thread. Please share realtor experiences, including what went wrong. Please do not post phone numbers of private individuals publicly. Use the Recommendations page or message people directly.', replies: [
    { author: 'pieter', date: '2026-07-10', body: 'Good experience with Ms. Hoa at Lotus Home Realty. She showed us 6 places in Ecopark in one morning and negotiated the deposit down to one month.' },
    { author: 'grace', date: '2026-08-02', body: 'Be careful with listings that show furniture that is not included. Ask for a written inventory before signing.' },
    { author: 'ryan', date: '2026-08-15', body: 'One agent asked for a “holding fee” in cash before showing us anything. We walked away. Never pay before you have seen the place and the contract.' }] },
  { id: 't6', forum: 'housing', title: 'Is a 12-month lease with two months’ deposit normal?', author: 'marcus', date: '2026-10-14', body: 'First apartment offer in Ocean Park: 12-month lease, two months’ deposit, rent paid quarterly in advance. Is this standard, and is any of it negotiable?', replies: [] },
  { id: 't7', forum: 'health', title: 'Insurance for a partner who isn’t employed by VinUni', author: 'yasmin', date: '2026-10-13', body: 'My husband will not work here at first. Is he covered under my plan, or do we need to buy separate insurance? HR pointed me to a PDF but it’s unclear about spouses.', replies: [
    { author: 'priya', date: '2026-10-13', body: 'From my experience (not official advice): check the dependants section of your benefits summary. Some plans let you add a spouse at your own cost during the first 30 days only. HR is running an insurance Q&A on 29 October that is worth joining.' }] },
  { id: 't8', forum: 'health', title: 'Which hospitals have English-speaking paediatricians?', author: 'aisha', date: '2026-09-15', body: 'Looking for a paediatrician who speaks English for routine check-ups and the occasional fever at 2am.', replies: [
    { author: 'fatima', date: '2026-09-16', body: 'Red River Family Clinic in Long Biên has two English-speaking paediatricians and a 24h line.' },
    { author: 'priya', date: '2026-09-17', body: 'Adding: save the clinic’s emergency number before you need it. In an emergency, the public ambulance number is 115.' }] },
  { id: 't9', forum: 'food', title: 'Where to find rye flour and Nordic baking supplies?', author: 'ingrid', date: '2026-09-30', body: 'I would trade a lot for proper rye bread. Anyone found rye flour, cardamom in bulk, or fresh yeast?', replies: [
    { author: 'laura', date: '2026-09-30', body: 'West Lake Imports in Tây Hồ has rye flour most weeks. Fresh yeast you have to ask for at the counter.' },
    { author: 'wei', date: '2026-10-01', body: 'Cardamom pods in bulk are cheap at the spice stalls in Long Biên market.' }] },
  { id: 't10', forum: 'food', title: 'Korean grocery delivery that reaches Gia Lâm', author: 'daniel', date: '2026-08-28', body: 'Sharing: Seoul Mart takes orders by Zalo and delivers to Ocean Park on Tuesdays and Fridays.', replies: [
    { author: 'kenji', date: '2026-08-29', body: 'They also have Japanese rice and miso. Thanks!' }] },
  { id: 't11', forum: 'food', title: 'Halal butchers east of the river?', author: 'fatima', date: '2026-10-05', body: 'Any reliable halal butcher or supermarket section on the Long Biên / Gia Lâm side?', replies: [
    { author: 'grace', date: '2026-10-06', body: 'The large supermarket in Long Biên has a small halal-certified section in the frozen aisle. Ask the staff, it is not labelled clearly.' }] },
  { id: 't12', forum: 'sports', title: 'Pickleball at Ocean Park: beginners welcome on Wednesdays', author: 'wei', date: '2026-10-01', body: 'We play every Wednesday at 18:00 at the courts in Park 2. Paddles to borrow. All levels.', replies: [
    { author: 'olivia', date: '2026-10-02', body: 'Can confirm, very friendly. I had never played before September.' },
    { author: 'samuel', date: '2026-10-03', body: 'I’ll come next week.' }] },
  { id: 't13', forum: 'sports', title: 'Anyone up for a half marathon in December?', author: 'kenji', date: '2026-10-08', body: 'Thinking of a training group for a December half marathon. Saturday long runs from campus, 06:00 to beat the heat.', replies: [
    { author: 'grace', date: '2026-10-08', body: 'In! I have been looking for a running group.' }] },
  { id: 't14', forum: 'books', title: 'Vote for November’s book', author: 'emily', date: '2026-10-10', body: 'October: “The Sympathizer”, meeting 22 October. Vote for November below: (1) “The Sorrow of War” (2) “Dust Child” (3) “Paradise of the Blind”.', replies: [
    { author: 'michael', date: '2026-10-10', body: '(1). It’s essential reading for anyone living here.' },
    { author: 'mateo', date: '2026-10-11', body: '(3) for me.' },
    { author: 'ingrid', date: '2026-10-12', body: '(1) as well.' }] },
  { id: 't15', forum: 'banking', title: 'Opening a bank account before your residence card arrives?', author: 'david', date: '2026-09-20', body: 'HR says my temporary residence card will take 4–6 weeks. Can I open an account with just a passport and work permit?', replies: [
    { author: 'olivia', date: '2026-09-20', body: 'Some banks will open a basic account with passport + visa + employment letter, then upgrade once the card arrives. Bring the HR letter, it makes all the difference.' },
    { author: 'james', date: '2026-09-21', body: 'Do it in week 1. Almost everything here is paid by QR code from a bank app.' }] },
  { id: 't16', forum: 'banking', title: 'Cheapest way to send money home every month?', author: 'samuel', date: '2026-10-11', body: 'I send part of my salary home each month. Bank wire fees are adding up. What do others use?', replies: [
    { author: 'olivia', date: '2026-10-11', body: 'Compare the total cost (fee + exchange-rate margin), not just the fee. A multi-currency account was cheapest for me, but check what your home bank allows. Not financial advice!' }] },
  { id: 't17', forum: 'weekend', title: 'Day trip ideas under 2 hours from Gia Lâm', author: 'mateo', date: '2026-09-26', body: 'Let’s build a list. Mine: Bát Tràng ceramics village (20 min), Đường Lâm ancient village, Ba Vì for hiking.', replies: [
    { author: 'ingrid', date: '2026-09-27', body: 'Ba Vì is lovely in October–November. Go early, it’s busy by 10.' },
    { author: 'mei', date: '2026-09-28', body: 'Bát Tràng with kids: book a pottery workshop, they love it.' }] },
  { id: 't18', forum: 'weekend', title: 'Ninh Bình in November: weather and where to stay?', author: 'ryan', date: '2026-10-14', body: 'Planning a long weekend in mid-November. Is it worth staying two nights? Any homestays people liked?', replies: [] },
  { id: 't19', forum: 'newto', title: 'What I wish I’d known in my first month', author: 'michael', date: '2026-08-15', pinned: true, body: 'A thread for newcomers. Add yours! Mine: get a local SIM at the airport, install Grab before you land, and don’t try to do everything in week one.', replies: [
    { author: 'hannah', date: '2026-08-15', body: 'Bring passport photos. Lots of paperwork wants them.' },
    { author: 'kenji', date: '2026-08-16', body: 'Rainy season is real. Buy a proper poncho, not an umbrella.' },
    { author: 'fatima', date: '2026-08-18', body: 'Say yes to every invitation in your first month, even when you are tired.' },
    { author: 'james', date: '2026-08-20', body: 'Find your buddy and actually call them. Most of us are happy to help.' }] },
  { id: 't20', forum: 'newto', title: 'Grab or Xanh SM for the daily commute?', author: 'yasmin', date: '2026-10-02', body: 'Is one more reliable for an 8am class from Long Biên?', replies: [
    { author: 'kenji', date: '2026-10-02', body: 'Both are fine. Book 10 minutes earlier than you think you need at 7:30–8:00.' }] },
  { id: 't21', forum: 'newto', title: 'Getting a SIM / eSIM on arrival', author: 'marcus', date: '2026-10-13', body: 'Should I sort this at the airport or wait?', replies: [
    { author: 'wei', date: '2026-10-13', body: 'Airport is easiest; they register it with your passport on the spot.' }] },
  // Revised version only
  { id: 't22', forum: 'health', revOnly: true, source: 'zalo', title: 'Pharmacies near campus that open late', author: 'priya', date: '2026-10-07', body: 'Saved from the Faculty Zalo group by a moderator so it can be searched later. Summary: two pharmacies at the Ocean Park main gate are open until 22:00, and one inside the S2 towers is open 24h.', replies: [
    { author: 'aisha', date: '2026-10-07', body: 'The 24h one has a pharmacist who speaks good English.' }] },
  { id: 't23', forum: 'partners', revOnly: true, title: 'Partners: anyone want to start a Vietnamese language group?', author: 'tom', date: '2026-10-06', body: 'I’m Hannah’s partner. A few of us at home during the day would love a weekly beginner Vietnamese class and coffee. Anyone interested?', replies: [
    { author: 'emily', date: '2026-10-07', body: 'My husband would love this. I’ll pass it on!' }] },

const GUIDES = [
  { id: 'g1', title: 'Your first week in Hanoi', cat: 'Settling in Hanoi', source: 'official', owner: 'io', reviewed: '2026-08-01', next: '2027-02-01', mins: 6, summary: 'A day-by-day checklist from landing at Nội Bài to your first payday.', sections: [
    { h: 'Before you land', body: '<ul><li>Install a ride-hailing app (Grab or Xanh SM) and a translation app with offline Vietnamese.</li><li>Bring passport photos (4×6 cm), printed copies of your contract and degree certificates.</li><li>Tell HR your flight number. VinUni can arrange airport pickup.</li></ul>' },
    { h: 'Days 1–3', body: '<ul><li>Buy a SIM or eSIM at the airport. It is registered to your passport on the spot.</li><li>Check in with HR for your work permit and residence card paperwork.</li><li>Collect your staff card and sign in to your VinUniversity account.</li></ul>' },
    { h: 'Days 4–7', body: '<ul><li>Open a bank account. Bring your passport, visa and HR employment letter.</li><li>Meet your buddy for coffee.</li><li>Walk around campus and Ocean Park, and find your nearest pharmacy and clinic.</li></ul>' },
    { h: 'Who to contact', body: '<p><b>HR</b> for contract, payroll, insurance and residence paperwork. <b>International Office</b> for visas and family visas. <b>IT</b> for accounts. This community is for everything else.</p>' }] },
  { id: 'g2', title: 'Choosing where to live', cat: 'Housing', source: 'faculty', owner: 'james', reviewed: '2026-03-10', next: '2026-09-10', mins: 8, summary: 'Neighbourhoods compared by commute, schools and atmosphere, plus how leases work.', sections: [
    { h: 'Neighbourhoods at a glance', body: '<table class="tbl"><thead><tr><th>Area</th><th>Commute to campus</th><th>Good for</th></tr></thead><tbody><tr><td>Ocean Park</td><td>5–15 min</td><td>Families, short commute, parks</td></tr><tr><td>Ecopark</td><td>20–30 min</td><td>Green space, quieter, houses</td></tr><tr><td>Long Biên</td><td>25–35 min</td><td>Local life, value, markets</td></tr><tr><td>Tây Hồ</td><td>45–60 min</td><td>International restaurants, lake, nightlife</td></tr><tr><td>Hoàn Kiếm</td><td>35–50 min</td><td>Old Quarter, culture, walking city</td></tr></tbody></table>' },
    { h: 'Leases and deposits', body: '<p>Most leases are 12 months, with one to two months’ deposit and rent paid monthly or quarterly. Everything is negotiable, especially the deposit and furniture. Get a written inventory before signing.</p>' },
    { h: 'Red flags', body: '<ul><li>Cash “holding fees” before a viewing.</li><li>No written contract, or a contract in Vietnamese only with no translation.</li><li>Furniture in photos that is “not included”.</li></ul>' }] },
  { id: 'g3', title: 'International and bilingual schools', cat: 'Schools', source: 'faculty', owner: 'emily', reviewed: '2026-07-15', next: '2027-01-15', mins: 7, summary: 'How the curricula differ, when to apply, and how the commute affects your choice.', sections: [
    { h: 'Curricula you will see', body: '<ul><li><b>IB</b> (PYP/MYP/DP): inquiry-based, internationally portable.</li><li><b>British</b> (IGCSE/A-Level): structured, exam-focused.</li><li><b>American</b>: AP courses, US-style transcripts.</li><li><b>Bilingual Vietnamese–English</b>: closer to campus, lower fees, strong integration.</li></ul>' },
    { h: 'When to apply', body: '<p>Apply as soon as you sign your contract. Mid-year places exist but are limited, especially for ages 7–10. Most schools can run assessments online before you arrive.</p>' },
    { h: 'Fees and allowances', body: '<p>Fees vary widely. Check your contract for any education allowance and ask HR what documents they need for reimbursement.</p>' }] },
  { id: 'g4', title: 'Opening a bank account', cat: 'Banking', source: 'official', owner: 'hr', reviewed: '2026-06-01', next: '2026-12-01', mins: 4, summary: 'What to bring, which documents HR provides, and how payments work in daily life.', sections: [
    { h: 'What to bring', body: '<ul><li>Passport with valid visa</li><li>Employment confirmation letter from HR</li><li>Temporary residence card (if you already have it)</li></ul>' },
    { h: 'Paying day to day', body: '<p>Most payments use QR codes from a banking app, including street food, taxis and rent. Set up your app on day one.</p>' },
    { h: 'Sending money abroad', body: '<p>International transfers need supporting documents (such as a payslip or contract). Ask your bank which documents it needs for regular transfers.</p>' }] },
  { id: 'g5', title: 'Health insurance and dependants', cat: 'Health insurance', source: 'official', owner: 'hr', reviewed: '2025-09-20', next: '2026-09-20', mins: 5, summary: 'What your university plan covers, how to add family members, and emergency numbers.', sections: [
    { h: 'Your plan', body: '<p>Sample content: see your benefits summary for inpatient, outpatient and dental limits. Keep your insurance card on your phone.</p>' },
    { h: 'Covering a partner and children', body: '<p>Sample content: dependants can be added during the enrolment window after you join. Contact HR Benefits within your first 30 days.</p>' },
    { h: 'Emergency numbers', body: '<table class="tbl"><tbody><tr><td>Ambulance</td><td><b>115</b></td></tr><tr><td>Police</td><td><b>113</b></td></tr><tr><td>Fire</td><td><b>114</b></td></tr></tbody></table>' }] },
  { id: 'g6', title: 'Medical care in Hanoi', cat: 'Medical care', source: 'faculty', owner: 'priya', reviewed: '2026-05-02', next: '2026-11-02', mins: 6, summary: 'International clinics, public hospitals, pharmacies and paediatric care, from faculty experience.', sections: [
    { h: 'Clinics vs. hospitals', body: '<p>International clinics have English-speaking staff and direct billing with many insurers. Large public hospitals are excellent for specialist care but expect queues and Vietnamese-only paperwork. Bring a Vietnamese-speaking friend.</p>' },
    { h: 'Pharmacies', body: '<p>Pharmacies are everywhere and many medicines are sold without prescription. Ask for the active ingredient, not the brand.</p>' }] },
  { id: 'g7', title: 'Getting around', cat: 'Transportation', source: 'faculty', owner: 'kenji', reviewed: '2026-09-01', next: '2027-03-01', mins: 4, summary: 'Ride-hailing, motorbikes, cycling and getting to Nội Bài airport.', sections: [
    { h: 'Ride-hailing', body: '<p>Grab and Xanh SM both work well. At peak times (07:30–08:30, 17:00–18:30) book 10 minutes early.</p>' },
    { h: 'Airport', body: '<p>Nội Bài is 45–60 minutes from campus. Pre-book a car for early flights.</p>' }] },
  { id: 'g8', title: 'International food and groceries', cat: 'Food markets', source: 'faculty', owner: 'laura', reviewed: '2026-04-10', next: '2026-10-10', mins: 5, summary: 'Where faculty find ingredients from home, from supermarkets to Zalo-order delivery.', sections: [
    { h: 'Supermarkets', body: '<p>Large supermarkets in Ocean Park and Long Biên carry imported basics. Specialty items are cheaper at import stores in Tây Hồ.</p>' },
    { h: 'Ordering by Zalo', body: '<p>Many small importers take orders through Zalo and deliver on fixed days. See the Recommendations page for current ones.</p>' }] },

const prefsFor = id => S.prefs[id] || defaultPrefs(person(id));
function factorScore(key, sk, c, pr) {
  switch (key) {
    case 'college': return sk.college === c.college ? [1, `Also in ${c.college}`] : [0, `Different college (${c.college})`];
    case 'culture': {
      const reg = c.regions.filter(r => sk.regions.includes(r)); if (reg.length) return [1, `Also familiar with ${reg[0]}`];
      const lang = c.languages.filter(l => l !== 'English' && sk.languages.includes(l)); if (lang.length) return [0.7, `Speaks ${lang[0]}`];
      return [0, 'No shared region or language'];
    }
    case 'family': {
      if (sk.family.vis === 'me' || (REV && sk.consent && !sk.consent.family)) return [0, 'You chose not to use family info'];
      if (c.family.vis === 'me') return [0, 'Family info not shared'];
      const k = c.family.kids.filter(x => sk.family.kids.includes(x)); if (k.length) return [1, `Children aged ${k[0]}`];
      if (c.family.kids.length && sk.family.kids.length) return [0.6, 'Also has children'];
      if (!c.family.kids.length && !sk.family.kids.length) return [0.5, 'Similar life stage'];
      return [0.1, 'Different life stage'];
    }
    case 'hobbies': { const h = c.interests.filter(x => pr.hobbies.includes(x)); return [Math.min(1, h.length / 2), h.length ? `Shares ${h.join(', ').toLowerCase()}` : 'No shared hobbies']; }
    case 'help': { if (!pr.help.length) return [0, 'No help topics chosen']; const h = c.helpTopics.filter(x => pr.help.includes(x)); return [h.length / pr.help.length, h.length ? `Can help with ${h.join(', ').toLowerCase()}` : 'Different help topics']; }
    case 'area': if (!pr.area || pr.area === 'Undecided') return [0.5, 'Area not decided yet']; return c.area === pr.area ? [1, `Also in ${c.area}`] : [0, `Lives in ${c.area}`];
  }
  return [0, ''];
}
function scoreFor(seekerId, c) {
  const sk = person(seekerId), pr = prefsFor(seekerId);
  const parts = FACTORS.map(f => { const [v, why] = factorScore(f.key, sk, c, pr); return { ...f, v, why, wt: (pr.imp[f.key] || 0) * (S.weights[f.key] || 0) }; });
  const tot = parts.reduce((a, p) => a + p.wt, 0) || 1;
  const raw = parts.reduce((a, p) => a + p.wt * p.v, 0) / tot;
  const ld = load_(c.id);
  return { id: c.id, pct: Math.round(raw * (1 - 0.1 * ld) * 100), raw: Math.round(raw * 100), parts, load: ld, max: c.buddy.max, full: ld >= c.buddy.max };
}
function suggestions(seekerId, exclude = []) {
  return S.faculty.filter(c => c.buddy.available && c.id !== seekerId && !c.isNew && !exclude.includes(c.id))
    .map(c => scoreFor(seekerId, c)).sort((a, b) => b.pct - a.pct);
}

  return { page: page || 'home', arg: rest.length ? decodeURIComponent(rest.join('/')) : '' };

function redirect(page, arg) {
  if (REV) {
    if (page === 'forums' || page === 'ask') return ['qa', ''];
    if (page === 'forum') return ['qa', ''];
    if (page === 'recs') return ['living', 'recs'];
  } else {
    if (page === 'qa' || page === 'arrival' || (page === 'admin' && arg === 'consent')) return ['home', ''];
  }
  if (page === 'arrival' && !(S.role === 'sofia' || S.role === 'erik')) return ['home', ''];
  if (page === 'admin' && !isAdmin()) return ['home', ''];
  if (page === 'match' && isPartner()) return ['home', ''];
  if (page === 'match' && isAdmin()) return ['admin', 'matching'];
  return null;
}

function expandEvents(from, to) {
  const out = [];
  for (const e of S.events) {
    if (e.weekly) { let d = e.date; while (d <= to) { if (d >= from) out.push({ ...e, date: d }); d = addDays(d, 7); } }

  return out.sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
}

      ${p.interests.length ? `<dt>Interests</dt><dd><div class="tags">${p.interests.map(x => `<span class="tag">${esc(x)}</span>`).join('')}</div></dd>` : ''}
      <dt>Languages</dt><dd>${esc(p.languages.join(', '))}</dd>

      ${showFam ? `<dt>Family</dt><dd>${p.family.partner ? 'Partner' : ''}${p.family.partner && p.family.kids.length ? ' · ' : ''}${p.family.kids.length ? 'Children aged ' + p.family.kids.join(', ') : ''}</dd>` : ''}

}

/* ---------- Directory ---------- */

      <select class="input" data-change="dir" name="topic"><option value="">Can help with…</option>${HELP_TOPICS.map(t => `<option ${f.topic === t ? 'selected' : ''}>${t}</option>`).join('')}</select>
      <select class="input" data-change="dir" name="interest"><option value="">Any interest</option>${S.tags.map(t => `<option ${f.interest === t ? 'selected' : ''}>${t}</option>`).join('')}</select>
      <select class="input" data-change="dir" name="lang"><option value="">Any language</option>${langs.map(t => `<option ${f.lang === t ? 'selected' : ''}>${t}</option>`).join('')}</select>

function dirResults() {
  const f = S.dir, q = f.q.trim().toLowerCase();

    .sort((a, b) => a.last.localeCompare(b.last));

    </article>`).join('') || '<div class="empty card">No one matches those filters.</div>'}</div>`;

/* ---------- Matching (§6) ---------- */
function flowSteps(status) {
  const steps = [['Onboarding form', 'What matters to you'], ['Suggestions', '3–5 matches'], [REV ? 'Coordinator confirms' : 'Admin confirms', REV ? 'By hand in the pilot' : 'Or user confirms'], ['Introduction', 'Both get an intro'], ['Check-in', 'After 2–4 weeks'], ['Re-match', 'If needed']];
  const idx = { none: 1, requested: 2, introduced: 3, checkin_due: 4, active: 5 }[status] ?? 1;
  return `<div class="flow mb16">${steps.map((s, i) => `<div class="flow-step ${i < idx ? 'done' : i === idx ? 'cur' : ''}">${s[0]}<small>${s[1]}</small></div>`).join('')}</div>`;
}
function matchCard(s, seekerId, opts = {}) {
  const p = person(s.id), why = s.parts.filter(x => x.wt && x.v >= .5).sort((a, b) => b.wt * b.v - a.wt * a.v).slice(0, 3);
  return `<article class="card match-card">
    <div class="row" style="align-items:flex-start">${av(s.id, 'lg')}<div style="flex:1;min-width:0"><div class="p-name strong">${esc(name(s.id))}</div><div class="small muted">${esc(p.title)} · ${p.college} · ${p.years} yrs in Hanoi</div></div><div class="score-ring" style="--p:${s.pct}"><b>${s.pct}%</b></div></div>
    <ul class="small" style="margin:0">${why.map(w => `<li>${esc(w.why)}</li>`).join('') || '<li class="muted">Few overlaps. Mostly a general guide.</li>'}</ul>
    <details><summary class="small" style="cursor:pointer;color:var(--navy-700);font-weight:600">Why this score?</summary><div class="mt8">${s.parts.map(x => `<div class="fbar"><span>${esc(x.label.split(' / ')[0].split(',')[0])}</span><div class="progress"><i style="width:${x.wt ? x.v * 100 : 0}%"></i></div><span>${x.wt ? Math.round(x.v * 100) : 'off'}</span></div>`).join('')}<div class="tiny muted mt8">Workload adjustment: −${s.load * 10}% (${s.load} of ${s.max} places used)</div></div></details>
    <div class="row between"><span class="small muted">${s.load} of ${s.max} buddy places used</span>${opts.action || ''}</div>
  </article>`;
}
PAGES.match = () => {
  const p = me();
  if (!p.isNew) return buddyView(p);
  const m = currentMatch(p.id);
  const head = pageHead(REV ? 'My buddy' : 'New Faculty Match', REV ? 'An experienced colleague who helps you settle in, ideally before you even land.' : 'Get matched with an established colleague who can help you settle in.', `${ref(6)} ${REV ? chg(5) : phase(2)}`);
  if (m && m.status !== 'rematch') return head + flowSteps(m.status) + matchStatus(m);
  return head + flowSteps('none') + matchForm(p);
}
function matchForm(p) {
  const pr = prefsFor(p.id);
  const sug = suggestions(p.id, S.matches.filter(m => m.seeker === p.id && m.status === 'rematch').map(m => m.buddy));
  const open = sug.filter(s => !s.full).slice(0, 5), full = sug.filter(s => s.full && s.raw >= 40);
  return `<div class="split"><div>
    <div class="row between mb12"><h2 style="font-family:var(--serif);font-size:22px;color:var(--navy-900);font-weight:600">Suggested buddies</h2><span class="small muted">${REV ? 'Your coordinator confirms the final pick with you' : 'Ranked by the factors you chose'}</span></div>
    ${full.length ? `<div class="notice warn mb16">${ic('info')}<div>${full.map(s => `<b>${esc(name(s.id))}</b> (${s.raw}% before workload)`).join(', ')} would be a good match but ${full.length > 1 ? 'are' : 'is'} at capacity. We spread buddies out so no one gets every newcomer.</div></div>` : ''}
    <div class="grid g2">${open.map(s => matchCard(s, p.id, { action: `<button class="btn primary sm" data-act="requestmatch" data-id="${s.id}">${REV ? 'I’d like ' + esc(first(s.id)) : 'Request'}</button>` })).join('')}</div>
  </div>
  <aside class="card"><div class="card-h"><h2>${ic('sliders')}What matters to you?</h2></div><div class="card-b">
    <p class="small muted">Changes update the suggestions straight away.</p>
    ${FACTORS.map(f => `<div class="imp"><span class="small strong">${esc(f.label)}${f.key === 'family' ? ` <span class="tiny muted">(private)</span>` : ''}</span><div class="seg">${[['0', 'Off'], ['1', 'Nice'], ['2', 'Key']].map(([v, l]) => `<button type="button" class="${String(pr.imp[f.key]) === v ? 'on' : ''}" data-act="imp" data-k="${f.key}" data-v="${v}">${l}</button>`).join('')}</div></div>`).join('')}
    <div class="field mt16"><span class="lbl">I’d like help with</span>${chipSet('mhelp', HELP_TOPICS, pr.help).replace(/name="mhelp"/g, 'name="mhelp" data-change="mpref"')}</div>
    <div class="field"><span class="lbl">Hobbies to share</span>${chipSet('mhob', S.tags, pr.hobbies).replace(/name="mhob"/g, 'name="mhob" data-change="mpref"')}</div>
    <div class="field"><label>Where you’ll live (broad area)</label><select class="input" data-change="mpref" name="marea">${AREAS.map(a => `<option ${a === pr.area ? 'selected' : ''}>${a}</option>`).join('')}</select></div>
  </div></aside></div>`;
}
function matchStatus(m) {
  const b = person(m.buddy);
  if (m.status === 'requested') return `<section class="card card-pad" style="max-width:760px"><div class="row" style="gap:16px">${av(b.id, 'lg')}<div><div class="strong" style="font-size:17px">You asked for ${esc(name(b.id))}</div><div class="muted small">Requested ${fmt(m.created)} · waiting for ${REV ? 'your coordinator' : 'Faculty Affairs'} to confirm</div></div></div>
    <div class="notice mt16">${ic('info')}<div><b>Demo tip:</b> switch to <b>Linh Trần (administrator)</b> to confirm this match, then come back.</div></div>
    <div class="row mt16"><button class="btn" data-act="showme" data-who="linh" data-go="admin/matching">${ic('swap', 'sm')}Switch to Linh</button><button class="btn ghost" data-act="cancelmatch" data-id="${m.id}">Cancel request</button></div></section>`;
  const intro = `<section class="card" style="max-width:860px"><div class="card-h"><h2>${ic('mail')}Introduction · ${fmt(m.intro)}</h2><span class="badge navy">${REV ? 'Automated' : 'Power Automate'}</span></div><div class="card-b">
    <div class="row mb16">${av(m.seeker)}${ic('link')}${av(m.buddy)}<div class="small muted">${esc(name(m.seeker))} and ${esc(name(m.buddy))}</div></div>
    <p>Hi ${first(m.seeker)} and ${first(m.buddy)}, meet each other! ${first(m.buddy)} has been in Hanoi for ${b.years} years and offered to help with ${b.helpTopics.join(', ').toLowerCase() || 'settling in'}. ${REV && isPre() ? 'A short video call before ' + first(m.seeker) + ' arrives is a great start.' : 'A coffee on campus this week is a great start.'}</p>
    <div class="row wrap"><button class="btn primary sm" data-act="contact" data-id="${b.id}">${ic('chat', 'sm')}Message ${esc(first(b.id))}</button><button class="btn sm" data-act="person" data-id="${b.id}">View profile</button></div></div></section>`;
  if (m.status === 'introduced') return intro + `<section class="card card-pad mt16" style="max-width:860px"><div class="row between wrap"><div><b>Check-in scheduled for ${fmt(m.checkin)}</b><div class="small muted">We’ll ask how it’s going, and you can ask for a different match.</div></div><button class="btn" data-act="skipahead" data-id="${m.id}">${ic('clock', 'sm')}Demo: skip ahead 3 weeks</button></div></section>`;
  if (m.status === 'checkin_due') return `<section class="card mb16" style="max-width:860px;border-color:var(--navy-500)"><div class="card-h"><h2>${ic('help')}How’s it going with ${esc(first(b.id))}?</h2><span class="badge navy">Check-in</span></div><div class="card-b"><p class="small muted">Only Faculty Affairs sees your answer.</p><div class="row wrap"><button class="btn primary" data-act="checkin" data-id="${m.id}" data-v="well">Going well</button><button class="btn" data-act="checkin" data-id="${m.id}" data-v="notyet">We haven’t connected yet</button><button class="btn" data-act="checkin" data-id="${m.id}" data-v="rematch">${ic('refresh', 'sm')}I’d like a different match</button></div></div></section>` + intro;
  return `<div class="notice green mb16" style="max-width:860px">${ic('check')}<div>Check-in done: <b>${esc(m.checkinResult || 'Going well')}</b>. ${esc(first(b.id))} stays your buddy for as long as you both like.</div></div>` + intro;
}
function buddyView(p) {
  const mine = S.matches.filter(m => m.buddy === p.id && ACTIVE_M.includes(m.status));
  const pending = S.matches.filter(m => m.buddy === p.id && m.status === 'requested');
  return pageHead(REV ? 'Buddy programme' : 'New Faculty Match', 'Volunteer as a buddy for colleagues who are new to Hanoi.', ref(6))
    + `<div class="split"><div class="stack">
    <section class="card"><div class="card-h"><h2>${ic('link')}Your buddies</h2><span class="small muted">${load_(p.id)} of ${p.buddy.max} places used</span></div><div class="card-b">
      ${mine.map(m => `<div class="list-item">${av(m.seeker)}<div class="li-main"><span class="li-title">${esc(name(m.seeker))}</span><span class="li-sub">${person(m.seeker).college} · introduced ${fmt(m.intro)} · ${m.status === 'checkin_due' ? 'check-in due ' + fmt(m.checkin) : m.checkinResult ? 'check-in: ' + m.checkinResult : 'check-in ' + fmt(m.checkin)}</span></div><button class="btn sm" data-act="contact" data-id="${m.seeker}">${ic('chat', 'sm')}Message</button></div>`).join('') || '<div class="muted small">No current buddies.</div>'}
      ${pending.length ? `<div class="hr"></div><div class="small muted mb8">Requested, waiting for ${REV ? 'the coordinator' : 'admin confirmation'}</div>${pending.map(m => `<div class="list-item">${av(m.seeker)}<div class="li-main"><span class="li-title">${esc(name(m.seeker))}</span><span class="li-sub">Asked for you ${ago(m.created)}</span></div></div>`).join('')}` : ''}
    </div></section>
    <section class="card"><div class="card-h"><h2>${ic('users')}Newcomers who might like your help</h2></div><div class="card-b">${S.faculty.filter(f => f.isNew && !currentMatch(f.id)).map(f => { const s = scoreFor(f.id, p); return `<div class="list-item">${av(f.id)}<div class="li-main"><span class="li-title">${esc(name(f.id))}</span><span class="li-sub">${f.college} · ${f.preArrival ? 'arriving ' + fmtShort(f.joined) : 'joined ' + ago(f.joined)} · wants help with ${f.wantsHelp.join(', ').toLowerCase()}</span></div><span class="badge navy">${s.pct}%</span></div>`; }).join('') || '<div class="muted small">Every newcomer has a buddy.</div>'}</div></section>
  </div>
  <aside class="card card-pad"><b>Your availability</b><label class="row mt12"><span class="toggle"><input type="checkbox" data-change="buddyavail" ${p.buddy.available ? 'checked' : ''}><span></span></span><span class="small">Available as a buddy</span></label>
    <p class="small muted mt12">You can take up to <b>${p.buddy.max}</b> at a time (change this on your profile). When you’re full, you stop appearing in suggestions, so the same helpful people don’t get every match.</p>
    <div class="hr"></div><b class="small">What a buddy does</b><ul class="small mt8"><li>A first coffee or video call</li><li>Answer “where do I…” questions for the first couple of months</li><li>Invite them to one community event</li></ul></aside></div>`;
}

/* ---------- Living in Hanoi (§3) ---------- */

  const tabs = REV ? `<div class="tabs"><a href="#/living" class="${arg !== 'recs' ? 'on' : ''}">${ic('book', 'sm')}Guides</a><a href="#/living/recs" class="${arg === 'recs' ? 'on' : ''}">${ic('star', 'sm')}Faculty recommendations</a></div>` : '';

  const cats = [...new Set(S.guides.map(g => g.cat))];
  const list = S.guides.filter(g => !S.guideCat || g.cat === S.guideCat);
  return pageHead('Living in Hanoi', 'Curated guides for the practical side of moving here. Official information is clearly marked and kept apart from peer advice.', `${ref(3)} ${ref(7, 'official vs peer')} ${tech('SharePoint')}`) + `<div class="banner ph-fountain mb16"><span>VinUniversity campus, Gia Lâm, Hanoi</span></div>` + tabs
    + `<div class="chips mb16"><span class="chip ${!S.guideCat ? 'on' : ''}" data-act="guidecat" data-v="">All</span>${cats.map(c => `<span class="chip ${S.guideCat === c ? 'on' : ''}" data-act="guidecat" data-v="${esc(c)}">${esc(c)}</span>`).join('')}</div>

};
PAGES.guide = id => {
  const g = S.guides.find(x => x.id === id); if (!g) return PAGES.living('');

      ${g.source === 'faculty' ? `<div class="notice gold">${ic('info')}<div>Written by faculty from their own experience. It is not official VinUniversity guidance. ${g.cat === 'Housing' ? 'Mentions of realtors are not endorsements.' : ''}</div></div>` : `<div class="notice">${ic('shield')}<div>Official information maintained by ${esc(name(g.owner))}. Sample content for this demo.</div></div>`}
      ${g.sections.map((s, i) => `<h2 id="s${i}">${esc(s.h)}</h2>${s.body}`).join('')}
      <div class="hr"></div><div class="row wrap between"><span class="small muted">Was this useful?</span><div class="row"><button class="btn sm" data-act="helpful">${ic('check', 'sm')}Yes</button><button class="btn sm" data-act="outdated" data-kind="guide" data-id="${g.id}">${ic('flag', 'sm')}Report outdated info</button></div></div>
    </article>
    <aside class="stack"><section class="card card-pad toc"><b>On this page</b><div class="mt8">${g.sections.map((s, i) => `<a href="javascript:void 0" data-act="scrollto" data-id="s${i}">${esc(s.h)}</a>`).join('')}</div></section>
      ${related.length ? `<section class="card card-pad"><b>Related conversations</b><div class="mt8">${related.map(threadItem).join('')}</div></section>` : ''}</aside></div>`;
};

/* ---------- Recommendations (§3) ---------- */
PAGES.recs = () => pageHead('Recommendations', 'Services and places colleagues have used, with dates so you can tell whether they’re still current.', `${ref(3)} ${ref(7, 'review dates')}`) + recsBody();
function recsBody() {

  const list = S.recs.filter(r => !S.recCat || r.cat === S.recCat).sort((a, b) => b.date.localeCompare(a.date));
  return `<div class="row between wrap mb16"><div class="chips"><span class="chip ${!S.recCat ? 'on' : ''}" data-act="reccat" data-v="">All</span>${cats.map(c => `<span class="chip ${S.recCat === c ? 'on' : ''}" data-act="reccat" data-v="${esc(c)}">${esc(c)}</span>`).join('')}</div>
    <button class="btn primary" data-act="addrec">${ic('plus', 'sm')}Add a recommendation</button></div>
    <div class="row wrap small muted mb16" style="gap:16px"><span class="fresh current"><i></i>Confirmed in the last 6 months</span><span class="fresh due"><i></i>6–12 months: review due</span><span class="fresh old"><i></i>Over a year: likely outdated</span></div>
    <div class="grid g-auto">${list.map(r => `<article class="card rec"><div class="row between"><span class="tag">${esc(r.cat)}</span>${freshBadge(r.date)}</div><h3>${esc(r.name)}</h3><p class="small" style="margin:0">${esc(r.notes)}</p>

function calendar() {
  const { y, m } = S.cal, firstDay = new Date(y, m, 1), start = new Date(firstDay); start.setDate(1 - ((firstDay.getDay() + 6) % 7));
  const evs = expandEvents(iso(start), iso(new Date(y, m + 1, 7))).filter(e => !S.evCat || e.cat === S.evCat);
  const cells = [];
  for (let i = 0; i < 42; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i); const k = iso(d);
    if (i >= 35 && d.getMonth() !== m) break;
    cells.push(`<div class="day ${d.getMonth() !== m ? 'out' : ''} ${k === TODAY_ISO ? 'today' : ''}"><span class="dn">${d.getDate()}</span>${evs.filter(e => e.date === k).map(e => `<span class="ev ${e.official ? 'official' : e.cat}" data-act="event" data-id="${e.id}" title="${esc(e.title)}">${e.time} ${esc(e.title)}</span>`).join('')}</div>`);
  }
  return `<section class="card"><div class="card-h"><button class="icon-btn" data-act="calnav" data-v="-1" aria-label="Previous month">${ic('back')}</button><h2 style="font-family:var(--serif);font-size:20px">${MONTH[m]} ${y}</h2><button class="icon-btn" data-act="calnav" data-v="1" aria-label="Next month">${ic('chev')}</button></div>
    <div class="cal">${['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(d => `<div class="dow">${d}</div>`).join('')}${cells.join('')}</div></section>`;
}

function kpis() {
  const c = adminCounts();
  const items = [
    ['New users (30 days)', S.faculty.filter(f => (TODAY - D(f.joined)) / 864e5 <= 30 && D(f.joined) <= TODAY).length, 'Joined since 15 Sep', 'users'],
    ['Incomplete profiles', S.faculty.filter(f => f.complete < 70).length, 'Under 70% complete', 'user', true],
    ['Unanswered questions', S.threads.filter(t => !t.replies.length).length, 'No reply yet', 'help', true],
    [REV ? 'Active topics' : 'Active groups', (REV ? [...activeForums(), PARTNER_TAG] : activeForums()).filter(f => S.threads.some(t => t.forum === f.id && monthsSince(lastActivity(t)) < 1)).length, 'Posts in the last 30 days', 'message'],
    ['Upcoming events', upcomingEvents(100, e => e.date <= addDays(TODAY_ISO, 30)).length, 'Next 30 days', 'calendar'],
    ['Matching requests', c.matching, 'Waiting for confirmation', 'link', c.matching > 0],
  ];
  return `<div class="grid g3 mb16" style="grid-template-columns:repeat(auto-fill,minmax(155px,1fr))">${items.map(([l, v, s, i, al]) => `<div class="card kpi ${al && v ? 'alert' : ''}"><div class="k-l">${ic(i, 'sm')}${l}</div><div class="k-v">${v}</div><div class="k-s">${s}</div></div>`).join('')}</div>`;
}
function wauChart() {
  const W = 560, H = 180, P = 28, max = 80, bw = (W - P * 2) / WAU.length;
  const bars = WAU.map((v, i) => { const h = (v / max) * (H - P * 2); return `<rect x="${P + i * bw + 4}" y="${H - P - h}" width="${bw - 8}" height="${h}" rx="3" fill="${i === WAU.length - 1 ? 'var(--red)' : 'var(--navy-700)'}"><title>Week ${i + 1}: ${v}</title></rect>${i === WAU.length - 1 ? `<text x="${P + i * bw + bw / 2}" y="${H - P - h - 6}" text-anchor="middle" style="fill:var(--ink);font-weight:700">${v}</text>` : ''}`; }).join('');
  const grid = [0, 20, 40, 60, 80].map(v => { const y = H - P - (v / max) * (H - P * 2); return `<line x1="${P}" x2="${W - P}" y1="${y}" y2="${y}" stroke="var(--line-2)"/><text x="${P - 6}" y="${y + 4}" text-anchor="end">${v}</text>`; }).join('');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Weekly active users over 12 weeks">${grid}${bars}<text x="${P}" y="${H - 8}">12 weeks ago</text><text x="${W - P}" y="${H - 8}" text-anchor="end">this week</text></svg></div>`;
}
function topicBars() {
  const ids = REV ? [...activeForums(), PARTNER_TAG] : activeForums();
  const rows = ids.map(f => [f.short, S.threads.filter(t => t.forum === f.id).reduce((a, t) => a + 1 + t.replies.length, 0)]).sort((a, b) => b[1] - a[1]);
  const max = Math.max(...rows.map(r => r[1]), 1);
  return rows.map(([l, v]) => `<div class="hbar"><span class="small">${esc(l)}</span><div class="progress"><i style="width:${v / max * 100}%"></i></div><b class="small">${v}</b></div>`).join('');
}

function approveMatch(id) {
  const m = S.matches.find(x => x.id === id);
  if (load_(m.buddy) >= person(m.buddy).buddy.max && !confirm(`${name(m.buddy)} is at capacity. Confirm anyway?`)) return;
  m.status = 'introduced'; m.intro = TODAY_ISO; m.checkin = addDays(TODAY_ISO, 21);
  notify(m.seeker, `You’ve been introduced to your buddy, ${name(m.buddy)}!`, 'match');
  notify(m.buddy, `Meet your new buddy: ${name(m.seeker)}.`, 'match');
  audit(`Confirmed buddy match: ${name(m.seeker)} + ${name(m.buddy)}`);
  toast(`Introduction sent to ${first(m.seeker)} and ${first(m.buddy)}`, true); render();
}
