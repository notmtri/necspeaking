<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VinCupid</title>
<meta name="description" content="VinCupid — a dating app prototype for the VinUni community, with an AI safety agent.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6efeb; --surface:#ffffff; --sunken:#f8f1ee; --line:#ecdfd9;
  --ink:#2a1a1f; --muted:#6c565c; --subtle:#857077;
  --brand:#d93a55; --brand-2:#f2765b; --brand-ink:#ffffff; --brand-soft:#fde6ea;
  --navy:#1f2d5c;
  --green:#18794e; --green-soft:#e3f4eb; --red:#b83232; --red-soft:#fbe7e5;
  --amber:#8f5600; --amber-soft:#fcf0d9; --gold:#b8860b; --gold-soft:#fbf1d6;
  --r-sm:10px; --r:16px; --r-lg:24px;
  --shadow:0 12px 32px rgba(70,20,35,.12);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#120c0e; --surface:#1d1416; --sunken:#171012; --line:#36262b;
    --ink:#f8edf0; --muted:#cdb7bd; --subtle:#a8929a;
    --brand:#ff6680; --brand-2:#ff8a6b; --brand-ink:#22080e; --brand-soft:#3b1b23;
    --navy:#aab8ff;
    --green:#62d69f; --green-soft:#132b22; --red:#ff8080; --red-soft:#381818;
    --amber:#f2b552; --amber-soft:#33260e; --gold:#f0c24b; --gold-soft:#2f2610;
    --shadow:0 12px 32px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg:#120c0e; --surface:#1d1416; --sunken:#171012; --line:#36262b;
  --ink:#f8edf0; --muted:#cdb7bd; --subtle:#a8929a;
  --brand:#ff6680; --brand-2:#ff8a6b; --brand-ink:#22080e; --brand-soft:#3b1b23;
  --navy:#aab8ff;
  --green:#62d69f; --green-soft:#132b22; --red:#ff8080; --red-soft:#381818;
  --amber:#f2b552; --amber-soft:#33260e; --gold:#f0c24b; --gold-soft:#2f2610;
  --shadow:0 12px 32px rgba(0,0,0,.45);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito Sans',ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--brand)}
.phone{max-width:440px;margin:0 auto;min-height:100dvh;background:var(--surface);position:relative;display:flex;flex-direction:column;box-shadow:0 0 0 1px var(--line)}
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:12px 16px;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.logo{font-weight:900;font-size:20px;letter-spacing:-.02em;display:flex;align-items:center;gap:6px;color:var(--ink);text-decoration:none}
.logo b{color:var(--brand)}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:800;border:1px solid var(--line);background:var(--sunken);color:var(--muted);cursor:pointer;white-space:nowrap}
.pill.on{background:var(--green-soft);color:var(--green);border-color:transparent}
.pill.gold{background:var(--gold-soft);color:var(--gold);border-color:transparent}
main{flex:1;padding:16px 16px 96px}
nav.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:30}
nav.bottom button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--subtle);padding:6px 0;cursor:pointer;position:relative}
nav.bottom button .ic{font-size:20px;line-height:1}
nav.bottom button.active{color:var(--brand)}
nav.bottom .badge{position:absolute;top:2px;right:calc(50% - 22px);background:var(--brand);color:var(--brand-ink);font-size:10px;border-radius:999px;padding:1px 5px}
h1{font-size:26px;line-height:1.15;margin:4px 0 6px;letter-spacing:-.02em}
h2{font-size:18px;margin:20px 0 8px}
h3{font-size:15px;margin:14px 0 6px}
p{line-height:1.5;margin:6px 0}
.muted{color:var(--muted)} .subtle{color:var(--subtle);font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:13px 20px;font-weight:800;cursor:pointer;background:var(--sunken);color:var(--ink);border:1px solid var(--line);text-decoration:none;font-size:15px}
.btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:var(--brand-ink);border:0}
.btn.gold{background:linear-gradient(135deg,#d9a520,#f3c94f);color:#2b1d00;border:0}
.btn.danger{background:var(--red-soft);color:var(--red);border-color:transparent}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.sm{padding:8px 14px;font-size:13px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,.chip:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,nav.bottom button:focus-visible,.choice:focus-visible{outline:3px solid color-mix(in srgb,var(--brand) 55%,transparent);outline-offset:2px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.sunk{background:var(--sunken);border-radius:var(--r);padding:14px}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:13px;color:var(--muted)}
input[type=text],input[type=email],input[type=password],input[type=url],input[type=number],input[type=date],textarea,select{width:100%;padding:12px 14px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--sunken);font-size:15px;color:var(--ink)}
textarea{min-height:96px;resize:vertical;line-height:1.45}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--sunken);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer;color:var(--ink)}
.chip.sel{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
.choice{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:16px;border-radius:var(--r);border:2px solid var(--line);background:var(--sunken);cursor:pointer}
.choice.sel{border-color:var(--brand);background:var(--brand-soft)}
.choice .em{font-size:30px}
.choice b{display:block;font-size:16px}
.choice span{color:var(--muted);font-size:13px}
.err{color:var(--red);font-weight:700;font-size:14px;min-height:1em}
.tag{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:800;background:var(--sunken);color:var(--muted)}
.tag.green{background:var(--green-soft);color:var(--green)} .tag.red{background:var(--red-soft);color:var(--red)}
.tag.navy{background:color-mix(in srgb,var(--navy) 14%,transparent);color:var(--navy)}
.tag.brand{background:var(--brand-soft);color:var(--brand)}
.flags{display:grid;gap:6px}
.flag{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:12px;font-size:14px;font-weight:600;line-height:1.35}
.flag.g{background:var(--green-soft);color:var(--green)} .flag.r{background:var(--red-soft);color:var(--red)}

/* photos */
.ph{position:relative;overflow:hidden;background:hsl(var(--h) 70% 82%);border-radius:var(--r)}
.ph .fb{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(150deg,hsl(var(--h) 75% 78%),hsl(calc(var(--h) + 40) 70% 62%));color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.2)}
.ph .fb span{font-size:56px;font-weight:900;letter-spacing:-.03em}
.ph .fb small{font-weight:800;opacity:.85}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph.blur img,.ph.blur .fb{filter:blur(22px) saturate(1.2);transform:scale(1.15)}
.ph .lock{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#fff;font-weight:900;text-shadow:0 2px 8px rgba(0,0,0,.4);text-align:center;padding:10px}

/* discover card */
.deck{position:relative;height:min(620px,calc(100dvh - 240px));min-height:460px}
.swipe{position:absolute;inset:0;border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow);background:var(--surface);touch-action:pan-y;user-select:none;transition:transform .25s ease}
.swipe.dragging{transition:none}
.swipe .ph{position:absolute;inset:0;border-radius:0}
.swipe .bars{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:4px;z-index:3}
.swipe .bars i{flex:1;height:4px;border-radius:4px;background:rgba(255,255,255,.45)}
.swipe .bars i.on{background:#fff}
.swipe .tapl,.swipe .tapr{position:absolute;top:0;bottom:45%;width:40%;z-index:2;background:none;border:0;cursor:pointer}
.swipe .tapl{left:0}.swipe .tapr{right:0}
.swipe .info{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:70px 16px 16px;color:#fff;background:linear-gradient(transparent,rgba(20,5,10,.82) 45%)}
.swipe .info h2{margin:0;font-size:26px;color:#fff}
.swipe .info .tag{background:rgba(255,255,255,.18);color:#fff;backdrop-filter:blur(4px)}
.swipe .info .tag.green{background:rgba(40,190,120,.35)}.swipe .info .tag.red{background:rgba(230,70,70,.38)}
.stamp{position:absolute;top:40px;z-index:4;font-size:30px;font-weight:900;padding:4px 14px;border:4px solid;border-radius:12px;opacity:0;transform:rotate(-14deg)}
.stamp.like{left:20px;color:#3ddc97;border-color:#3ddc97}
.stamp.nope{right:20px;color:#ff5d73;border-color:#ff5d73;transform:rotate(14deg)}
.actions{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:14px}
.round{width:58px;height:58px;border-radius:50%;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative}
.round.big{width:68px;height:68px;font-size:30px}
.round.sm{width:46px;height:46px;font-size:18px}
.round .mini{position:absolute;bottom:-4px;right:-4px;font-size:12px;background:var(--gold-soft);border-radius:999px;padding:1px 4px}
.counter{text-align:center;font-size:13px;color:var(--subtle);margin-top:10px;font-weight:700}

/* guide */
.guide{display:flex;gap:10px;align-items:flex-start;background:var(--brand-soft);border-radius:var(--r);padding:12px 14px;margin:10px 0 16px}
.guide .av{flex:none;width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand-2));display:flex;align-items:center;justify-content:center;font-size:20px}
.guide p{margin:0;font-size:14px;color:var(--ink)}
.guide b{color:var(--brand)}
.progress{height:6px;background:var(--sunken);border-radius:6px;overflow:hidden;margin:4px 0 6px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-2))}

/* chat */
.chat{display:flex;flex-direction:column;gap:8px;padding-bottom:140px}
.msg{max-width:80%;padding:10px 14px;border-radius:18px;line-height:1.4;font-size:15px;word-wrap:break-word}
.msg.me{align-self:flex-end;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:var(--brand-ink);border-bottom-right-radius:6px}
.msg.them{align-self:flex-start;background:var(--sunken);border-bottom-left-radius:6px}
.msg.flagged{outline:2px solid var(--red)}
.msg time{display:block;font-size:11px;opacity:.7;margin-top:3px}
.sys{align-self:center;max-width:92%;font-size:13px;padding:8px 12px;border-radius:12px;background:var(--amber-soft);color:var(--amber);font-weight:700;text-align:center}
.sys.red{background:var(--red-soft);color:var(--red)}
.compose{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;background:var(--surface);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));z-index:30}
.compose .row{flex-wrap:nowrap}
.compose input{flex:1;border-radius:999px}
.alert{border-radius:var(--r);padding:12px 14px;margin-bottom:10px;font-size:14px}
.alert.red{background:var(--red-soft);color:var(--red)}
.alert.amber{background:var(--amber-soft);color:var(--amber)}
.alert.green{background:var(--green-soft);color:var(--green)}
.alert b{display:block;margin-bottom:2px}

/* list */
.li{display:flex;gap:12px;align-items:center;padding:10px;border-radius:var(--r);cursor:pointer;border:0;background:none;width:100%;text-align:left}
.li:hover{background:var(--sunken)}
.li .ph{width:56px;height:56px;border-radius:50%;flex:none}
.li .ph .fb span{font-size:20px}.li .ph .fb small{display:none}
.li .t{flex:1;min-width:0}
.li .t b{display:block}
.li .t span{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.likes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.likes .ph{aspect-ratio:3/4}
.likes .ph .fb span{font-size:28px}.likes .ph .fb small{display:none}
.likes button{padding:0;border:0;background:none;cursor:pointer;position:relative}
.likes .nm{position:absolute;left:6px;bottom:6px;color:#fff;font-weight:800;font-size:13px;text-shadow:0 1px 6px rgba(0,0,0,.5);z-index:2}

/* profile */
.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.gallery .ph{aspect-ratio:3/4}
.gallery .ph:first-child{grid-column:1/-1;aspect-ratio:4/5}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fact{background:var(--sunken);border-radius:12px;padding:10px 12px}
.fact small{display:block;color:var(--subtle);font-size:12px;font-weight:700}
.fact b{font-size:15px}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{aspect-ratio:3/4;border:2px dashed var(--line);border-radius:var(--r);display:flex;align-items:center;justify-content:center;flex-direction:column;cursor:pointer;color:var(--subtle);font-weight:800;font-size:13px;position:relative;overflow:hidden;background:var(--sunken)}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot input{position:absolute;opacity:0;inset:0;cursor:pointer}
.slot .n{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.55);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px;z-index:2}
table.cmp{width:100%;border-collapse:collapse;font-size:14px}
table.cmp td,table.cmp th{padding:10px 6px;border-bottom:1px solid var(--line);text-align:left}
table.cmp th:not(:first-child),table.cmp td:not(:first-child){text-align:center;width:80px}
.stars{display:flex;gap:4px}
.stars button{font-size:32px;background:none;border:0;cursor:pointer;color:var(--line);padding:0}
.stars button.on{color:var(--gold)}

/* overlay */
.scrim{position:fixed;inset:0;background:rgba(15,5,8,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease}
.sheet{background:var(--surface);width:100%;max-width:440px;border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-height:88dvh;overflow:auto;animation:up .2s ease}
.sheet.center{text-align:center}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(30px);opacity:.4}}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:999px;font-weight:700;font-size:14px;z-index:60;max-width:calc(100% - 32px);text-align:center;animation:up .2s ease}
.hero-signin{padding:28px 4px 10px;text-align:center}
.hero-signin .big{font-size:64px}
.match-hearts{font-size:56px}
.loading{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="phone" id="app"></div>
<div id="overlay"></div>

async function gemini(prompt, { json = true, timeout = 20000 } = {}){
  if (!S.apiKey) throw new Error('No API key');
  const ctrl = new AbortController(); const timer = setTimeout(() => ctrl.abort(), timeout);
  try {
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(S.model)}:generateContent`, {
      method:'POST', signal:ctrl.signal,
      headers:{ 'Content-Type':'application/json', 'x-goog-api-key':S.apiKey },
      body: JSON.stringify({ contents:[{ role:'user', parts:[{ text:prompt }] }],
        generationConfig: json ? { responseMimeType:'application/json', temperature:0.7 } : { temperature:0.8 } }),
    });
    if (!res.ok) { let m = res.status + ''; try { m = (await res.json()).error.message; } catch {} throw new Error(m); }
    const data = await res.json();
    const text = (data.candidates?.[0]?.content?.parts || []).map(p => p.text || '').join('');
    return json ? JSON.parse(text.replace(/^```json|```$/g, '').trim()) : text.trim();
  } finally { clearTimeout(timer); }
}

  }

async function mockReply(id){
  const u = me(), x = userById(id), msgs = S.chats[chatKey(u.id, id)];
  typing = id; render(); scrollChat();
  let reply = null;
  if (aiOn()){
    try {
      const r = await gemini(`Role-play ${x.name} (${ageOf(x.dob)}, ${roleLabel(x)} at VinUniversity, ${x.college} ${x.major}) on the campus dating app VinCupid.
Bio: ${x.bio}. Favorites: ${x.favorites.join(', ')}. Green flags: ${x.green.join(', ')}. Red flags: ${x.red.join(', ')}.
Reply to the latest message in 1–2 short, warm, casual sentences, in the language the other person used. Set firm boundaries if they are rude or suspicious. Return JSON {"reply":"..."}.
Chat so far:\n${msgs.filter(m => m.from !== 'sys').slice(-10).map(m => (m.from === u.id ? u.short : x.short) + ': ' + m.text).join('\n')}`);
      reply = r.reply;
    } catch (e) { console.warn('Gemini reply failed', e); }
  }
  if (!reply){
    const canned = [`Haha okay, I like where this is going 😄`, `Wait, you're into that too? Tell me more!`, `Honestly ${x.favorites[0].toLowerCase()} is my whole personality right now.`,
      `I'm free after my Thursday afternoon class — coffee at the campus café?`, `Tell me something about you that's not on your profile 👀`];
    reply = canned[msgs.filter(m => m.from === id).length % canned.length];
    await new Promise(r => setTimeout(r, 900));
  }
  typing = null;
  pushMsg(u.id, id, { from:id, text:reply, t:Date.now() });
  if (route().name === 'chat') { render(); scrollChat(); }
}

function resizeImage(file){
  return new Promise((res, rej) => {
    const img = new Image(); img.onload = () => {
      const w = Math.min(720, img.width), h = Math.round(img.height * w / img.width);
      const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(img, 0, 0, w, h);
      res(c.toDataURL('image/jpeg', .78)); URL.revokeObjectURL(img.src);
    }; img.onerror = rej; img.src = URL.createObjectURL(file);
  });
}

      <p class="muted" style="text-align:center">Accidentally passed on someone cute? Premium lets you undo any swipe.</p>
      <button class="btn gold block" data-act="nav" data-arg="premium">👑 See Premium</button><button class="btn ghost block" data-act="closeModal">Not now</button>`);
    const h = S.history[S.userId] || []; const last = h.pop(); if (!last) return toast('Nothing to undo');
    delete S.swipes[S.userId][last];
    S.matches[S.userId] = (S.matches[S.userId] || []).filter(x => x !== last);
    save(); photoIdx = 0; render(); toast(`Brought back ${userById(last).short}`);
  },
  restartDeck: () => { const sw = S.swipes[S.userId] || {}; Object.keys(sw).forEach(k => sw[k] === 'pass' && delete sw[k]); save(); render(); },
  // chat
  send: id => { const v = document.getElementById('msgInput')?.value || ''; if (!pendingCheck) sendMessage(id, v); },
  sendAnyway: id => { closeModal(); sendMessage(id, draftMsg, { skipCheck:true }); },
  sendFlagged: id => {
    closeModal(); const u = me(), text = draftMsg; draftMsg = '';
    pushMsg(u.id, id, { from:u.id, text, t:Date.now(), flag:{ reason:'Flagged by VinCupid' } });
    pushMsg(u.id, id, { from:'sys', text:`VinCupid flagged this message for ${userById(id).short}'s safety.`, t:Date.now(), red:true });
    render(); mockReply(id);
  },
  useSuggestion: s => { closeModal(); draftMsg = s; render(); },
  chatMenu: id => openModal(`<h2>Chat options</h2><div class="stack">
      <button class="btn block" data-act="nav" data-arg="profile/${id}">View profile & ask for a review</button>
      <button class="btn block" data-act="demoScam" data-arg="${id}">🧪 Demo: receive a suspicious message</button>
      <button class="btn block" data-act="demoGhost" data-arg="${id}">🧪 Demo: fast-forward 2 days of silence</button>
      <button class="btn danger block" data-act="report" data-arg="${id}">Report</button>
      <button class="btn danger block" data-act="block" data-arg="${id}">Block & unmatch</button>
      <button class="btn ghost block" data-act="closeModal">Close</button></div>`),
  demoScam: async id => {
    closeModal(); const u = me();
    const text = 'Hey! I got you a modeling job offer abroad, pays really well 💸 Can you send me a photo of your passport and add me on Telegram? Keep it secret for now.';
    const v = await analyzeMessage(text, { sender:userById(id), receiver:u });
    pushMsg(u.id, id, { from:id, text, t:Date.now(), flag:v.verdict === 'ok' || v.verdict === 'coach' ? null : v });
    pushMsg(u.id, id, { from:'sys', text:`Safety alert: ${v.reason}`, t:Date.now(), red:true });
    render();
  },
  demoGhost: id => { closeModal(); const k = chatKey(S.userId, id); (S.chats[k] || []).forEach(m => m.t -= 49 * 3600e3); if (!(S.chats[k] || []).length) pushMsg(S.userId, id, { from:id, text:'Hey! Loved your profile 😊', t:Date.now() - 50 * 3600e3 }); save(); render(); },
  dismissFlag: id => { (S.chats[chatKey(S.userId, id)] || []).forEach(m => { if (m.flag) m.dismissed = true; }); save(); render(); },
  report: id => openModal(`<h2>Report ${esc(userById(id).short)}</h2><p class="muted">Reports are confidential. VinCupid's team reviews them within 24 hours.</p>
      <div class="stack">${['Harassment or sexual content', 'Scam or asking for money', 'Possible trafficking / job offers abroad', 'Fake profile', 'Ghosting after plans / disrespect', 'Abuse of academic position'].map(r => `<button class="choice" data-act="doReport" data-arg="${id}|${r}"><span>${r}</span></button>`).join('')}</div>
      <button class="btn ghost block" style="margin-top:8px" data-act="closeModal">Cancel</button>`),
  doReport: arg => { const [id, reason] = arg.split('|'); S.reports.push({ by:S.userId, id, reason, at:Date.now() }); save(); closeModal(); toast('Reported. Thank you for keeping VinUni safe 🛡️'); },
  block: id => {
    (S.blocked[S.userId] = S.blocked[S.userId] || {})[id] = true;
    S.matches[S.userId] = (S.matches[S.userId] || []).filter(x => x !== id);
    save(); closeModal(); toast(`${userById(id).short} is blocked`); go('matches');
  },
  // vouch
  askVouch: arg => {
    const [id, k] = arg.split(':'); const x = userById(id), c = x.vouchContacts[k];
    const link = vouchLink(b64({ u:id, c:Number(k), by:S.userId, n:Math.random().toString(36).slice(2, 7) }));
    const text = `Hi ${c.name}! ${me().short} matched with ${x.short} on VinCupid and would love an honest 1-minute review from their ${c.rel.toLowerCase()} 💘 ${link}`;
    openModal(`<h2>💌 Ask ${esc(c.name)} (${esc(c.rel.toLowerCase())})</h2><p class="muted">Copy this message and send it to ${esc(c.name)}.</p>
      <textarea readonly id="vouchMsg" style="min-height:130px">${esc(text)}</textarea>
      <div class="stack" style="margin-top:10px"><button class="btn primary block" data-act="copyVouch">Copy message</button>
      <a class="btn block" href="${esc(link)}" data-act="openVouch">Open the link (demo as ${esc(c.name)})</a>
      <button class="btn ghost block" data-act="closeModal">Close</button></div>
      <p class="subtle">Prototype: reviews are saved in the browser that opens the link.</p>`);
  },
  copyVouch: () => { const t = document.getElementById('vouchMsg'); navigator.clipboard?.writeText(t.value).then(() => toast('Copied!'), () => { t.select(); toast('Select & copy the text'); }); },
  openVouch: (_, el) => { closeModal(); vouchForm = { stars:0, g:[false, false, false], r:[false, false, false], note:'', err:'', busy:false }; vouchDone = false; location.hash = el.getAttribute('href').split('#')[1]; },
  vStar: n => { vouchForm.stars = Number(n); render(); },
  vSubmit: async token => {
    if (vouchForm.busy) return;
    const req = unb64(token), x = userById(req.u), c = x.vouchContacts[req.c];
    if (!vouchForm.stars){ vouchForm.err = 'Pick a star rating.'; return render(); }
    if (vouchForm.note.trim().length < 5){ vouchForm.err = 'Write a short note.'; return render(); }
    vouchForm.busy = true; vouchForm.err = ''; render();
    const v = await analyzeMessage(vouchForm.note, { sender:{ short:c.name, mode:'student' }, receiver:x });
    vouchForm.busy = false;
    if (v.verdict === 'block' || v.verdict === 'warn'){ vouchForm.err = 'VinCupid can’t publish this: ' + v.reason; return render(); }
    (S.vouches[x.id] = S.vouches[x.id] || []).push({ rel:c.rel, name:c.name, stars:vouchForm.stars, note:vouchForm.note.trim(), at:todayKey(),
      confirmed:{ green:vouchForm.g.filter(Boolean).length, red:vouchForm.r.filter(Boolean).length } });
    save(); vouchDone = true; render();
  },
  vouchHome: () => { vouchDone = false; go(S.userId ? 'discover' : ''); },
  // premium & settings
  togglePremium: () => { S.premium[S.userId] = !isPremium(); save(); render(); toast(isPremium() ? '👑 Welcome to Premium!' : 'Premium cancelled'); },
  toggleKey: (_, el) => { const i = document.getElementById('apiKey'); i.type = i.type === 'password' ? 'text' : 'password'; el.textContent = i.type === 'password' ? 'Show' : 'Hide'; },
  saveKey: () => { S.apiKey = document.getElementById('apiKey').value.trim(); S.model = document.getElementById('model').value.trim() || 'gemini-3.5-flash'; save(); render(); toast(S.apiKey ? 'API key saved — AI on ✦' : 'AI off'); },
  clearKey: () => { S.apiKey = ''; save(); render(); toast('API key cleared'); },
  testKey: async () => {
    A.saveKey(); const out = document.getElementById('keyStatus');
    if (!S.apiKey) return out.innerHTML = '<div class="alert amber">Enter a key first.</div>';
    out.innerHTML = '<p class="subtle"><span class="loading"></span> Contacting Gemini…</p>';
    try { const r = await gemini('Return JSON {"ok":true,"msg":"a 5-word cheerful greeting from VinCupid"}'); out.innerHTML = `<div class="alert green"><b>Connected ✓</b>${esc(r.msg || 'Gemini is ready.')}</div>`; }
    catch (e) { out.innerHTML = `<div class="alert red"><b>Couldn't connect</b>${esc(e.message)}</div>`; }
  },
  tryVinCupid: async () => {
    const t = document.getElementById('tryMsg').value; const out = document.getElementById('tryOut'); if (!t.trim()) return;
    out.innerHTML = '<p class="subtle"><span class="loading"></span> Analyzing…</p>';
    const demoMatch = allUsers().find(x => x.id !== S.userId && x.mode === me().mode);
    const v = await analyzeMessage(t, { sender:me(), receiver:demoMatch });
    const cls = { ok:'green', coach:'amber', warn:'amber', block:'red' }[v.verdict];
    out.innerHTML = `<div class="alert ${cls}"><b>${{ ok:'✓ Looks good', coach:'💘 Coach', warn:'⚠️ Warn', block:'🛑 Block' }[v.verdict]} · ${esc(v.category)} · via ${v.source === 'gemini' ? 'Gemini' : 'rules'}</b>${esc(v.reason || 'Nothing concerning. Send it!')}
      ${v.suggestions ? `<ul style="margin:6px 0 0;padding-left:18px">${v.suggestions.map(s => `<li>${esc(s)}</li>`).join('')}</ul>` : ''}</div>`;
  },
  theme: t => { try { localStorage.setItem('vincupid.theme', t); } catch {} applyTheme(); render(); },
  signOut: () => { S.userId = null; save(); go(''); },
  resetAll: () => { if (confirm('Reset all prototype data (matches, chats, profile edits)? Your API key is kept.')){ const k = S.apiKey, m = S.model; S = structuredClone(DEFAULT_STATE); S.apiKey = k; S.model = m; save(); go(''); } },
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const fn = A[t.dataset.act]; if (!fn) return;
  if (t.dataset.self && e.target !== t) return; // clicks inside a sheet don't close it
  if (t.tagName === 'A' || t.tagName === 'BUTTON') e.preventDefault();
  fn(t.dataset.arg, t, e);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && modal) closeModal(); });

applyTheme();
render();
</script>
</body>
</html>
